[project]
# Alpha's sibling, deliberately holding an `api` package with the same name. Neither
# declares the other, and neither can import the other's code.
name = "corpus-beta"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
