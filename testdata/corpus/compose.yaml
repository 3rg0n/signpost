# Corpus fixture. Compose Spec, no Docker-specific extensions.
services:
  api:
    image: docker.io/library/golang:1.26-alpine
    command: ["/hello"]
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - db
  db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
