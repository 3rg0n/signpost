# Corpus fixture: the non-gating workflow.
#
# Schedule-only, so nothing here can be a required check and no job in it can block a merge.
# That is the distinction the practices page reports, and a corpus with only ci.yml would
# leave the ungated branch of it untested.
name: nightly
on:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: make test
