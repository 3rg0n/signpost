name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a vulnerability disclosed against a dependency is found by a
  # scheduled run rather than by whatever unrelated pull request happens to come
  # next.
  schedule:
    - cron: "23 6 * * 1"

# Read-only by default; no job here needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    # Three platforms is not redundancy. Discovery normalises CRLF at ingest and
    # matches gitignore patterns case-sensitively on every platform so a Windows
    # checkout and a Linux runner produce identical bundles (§8.1). A
    # single-platform matrix would let exactly that regress silently.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned by commit SHA, not tag (§8 dependency governance). A tag
      # is mutable and has been moved in a real supply-chain compromise; a SHA is
      # the artifact itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Twice. signpost's output is committed to the repositories it analyses, so
      # nondeterministic output is commit churn in someone else's repo. Several
      # packages render freshly built graphs five times and compare bytes; a second
      # run exercises them under a different map seed.
      #
      # The timeout is raised from the 10-minute default because internal/vcs shells out
      # to the real git binary for every case, twice, and a Windows runner is slow enough
      # at process creation that the default is not a comfortable margin. A hang should
      # still fail rather than run to the job limit, so this is raised, not removed.
      - name: Test
        run: go test -count=2 -timeout 30m ./...

      - name: Test with the race detector
        # Linux only, once. The pipeline is single-goroutine today, so this guards a
        # future change rather than a per-platform concern, and the detector costs
        # roughly an order of magnitude in runtime.
        if: matrix.os == 'ubuntu-24.04'
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "these files are not gofmt'd:"
            echo "$out"
            exit 1
          fi

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          staticcheck ./...

      - name: shellcheck the installer
        # install.sh is piped from the network straight into a shell. A portability
        # bug there is a failed install on somebody's machine with no way to debug
        # it, so it is linted as POSIX sh rather than bash.
        run: shellcheck --shell=sh install.sh

      - name: installers are pure ASCII
        # Not style: PowerShell 5.1 decodes a BOM-less script as Windows-1252, so a
        # UTF-8 em dash arrives as three characters ending in U+201D — a right double
        # quotation mark the 5.1 parser accepts as a string terminator. The string
        # closes early and the file fails to parse lines away from the real cause.
        # This shipped once, in a script users pipe from the network into a shell,
        # because the parse check below originally ran only under pwsh 7.
        #
        # No grep -P: it is unavailable in some builds and errors out under LC_ALL=C
        # in others, and `if grep ...` reads that error as "nothing found" — a gate
        # that cannot fail. The exit code is checked explicitly for the same reason:
        # 1 is a clean file, 0 is a finding, anything else is a broken check.
        run: |
          set -uo pipefail
          # A literal tab inside the bracket expression; everything else must be a
          # printable ASCII character. Newlines are never part of a grep line.
          LC_ALL=C grep -n '[^	 -~]' install.sh install.ps1 && rc=0 || rc=$?
          case "$rc" in
            1) echo "both installers are pure ASCII" ;;
            0) echo "the lines above contain non-ASCII bytes; installers must stay ASCII"
               exit 1 ;;
            *) echo "the ASCII check itself failed with exit $rc"
               exit 1 ;;
          esac

  installer:
    name: installer parses (5.1 and 7)
    # A Windows runner because that is the only place PowerShell 5.1 exists, and 5.1
    # is what an `iex (irm ...)` line lands in on a default Windows box. Parsing only
    # under pwsh 7 let a script through that 5.1 could not parse at all.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse under Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1).Path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "5.1: parsed clean"

      - name: Parse under PowerShell 7
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1).Path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "7: parsed clean"

  dogfood:
    name: signpost analyses signpost
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Git signals read history. A shallow clone would make co-change and
          # churn silently thin rather than absent, which is the failure mode
          # this repository is built to refuse.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build -o signpost ./cmd/signpost

      # Running the binary on this repository is the only check that exercises
      # discovery, extraction, manifest reading, resolution, clustering, and
      # export together against a real tree rather than a fixture. Every unit
      # test here passed on both installer bugs shipped in v0.0.1, because a
      # test suite only covers what someone thought to assert.
      - name: Analyse this repository
        run: |
          set -euo pipefail
          ./signpost graph . 2>coverage.txt
          cat coverage.txt

      # Not a smoke test. `graph` exits 0 on an empty graph, so asserting the exit
      # code alone would pass if extraction silently stopped working. The floors
      # are deliberately well under the current numbers (15 nodes, 17 edges) so
      # ordinary growth never touches them and a collapse always does.
      #
      # Counted through jq rather than by grepping for '"id":', because attribute
      # keys come from the analysed repository: a repo with an attr named `id`
      # would inflate a grep count. jq failing is also the check that the export
      # is valid JSON, which no other step here establishes.
      - name: Coverage floors hold
        run: |
          set -euo pipefail
          ./signpost export -format json -quiet . > graph.json
          nodes="$(jq '.nodes | length' graph.json)"
          edges="$(jq '.edges | length' graph.json)"
          echo "nodes=${nodes} edges=${edges}"
          fail=0
          [ "$nodes" -ge 10 ] || { echo "only ${nodes} nodes; extraction has regressed"; fail=1; }
          [ "$edges" -ge 8 ] || { echo "only ${edges} edges; resolution has regressed"; fail=1; }
          # Module nodes specifically, because the total would stay above its floor
          # on manifest-derived nodes alone even if source discovery stopped
          # walking entirely. Five against a current seven: enough headroom that
          # merging two packages is not a build failure, low enough that losing
          # source discovery is.
          mods="$(jq '[.nodes[] | select(.kind == "Module")] | length' graph.json)"
          echo "module nodes=${mods}"
          [ "$mods" -ge 5 ] || { echo "only ${mods} module nodes; discovery has regressed"; fail=1; }
          # Confidence is the distinction the whole tool rests on. Nothing in the
          # deterministic pass may emit an inferred edge (§4.4); only the semantic
          # pass is permitted to, and it does not run here.
          guessed="$(jq '[.edges[] | select(.confidence != "extracted")] | length' graph.json)"
          [ "$guessed" -eq 0 ] || {
            echo "${guessed} edge(s) are not 'extracted' in a run with no model:"
            jq '[.edges[] | select(.confidence != "extracted")]' graph.json
            fail=1
          }
          exit "$fail"

      # The property §8.1 rests on: the bundle gets committed, so identical
      # input producing different bytes is commit churn in someone else's
      # repository. Tested in-process by several packages; this runs the whole
      # binary twice, which is what a user actually does.
      - name: Output is byte-identical across runs
        run: |
          set -euo pipefail
          for fmt in mermaid dot graphml json; do
            ./signpost export -format "$fmt" -quiet . > "a.${fmt}"
            ./signpost export -format "$fmt" -quiet . > "b.${fmt}"
            if ! cmp -s "a.${fmt}" "b.${fmt}"; then
              echo "${fmt} export is not deterministic:"
              diff "a.${fmt}" "b.${fmt}" | head -20
              exit 1
            fi
            echo "${fmt}: identical across two runs"
          done

      # signpost reports what it could not read, and that report is load-bearing
      # (§4.2). A coverage line claiming zero unresolved imports in a repository
      # that has them would be the tool lying about its own gaps, so the shape of
      # the report is checked rather than assumed.
      - name: Coverage report names its gaps
        run: |
          set -euo pipefail
          if ! grep -q '^analysed [0-9]* files: [0-9]* nodes, [0-9]* edges$' coverage.txt; then
            echo "coverage report is missing or malformed:"
            cat coverage.txt
            exit 1
          fi
          # This repository has one .sh and one .ps1, neither of which signpost
          # has an extractor for. It must say so. If someone adds those
          # extractors, this line is the reminder to update the assertion.
          if ! grep -q 'no extractor for' coverage.txt; then
            echo "expected an unhandled-language line for install.sh/install.ps1"
            cat coverage.txt
            exit 1
          fi
          echo "coverage report is well-formed and names its gaps"

      # The checkout above sets fetch-depth: 0 specifically so history can be read.
      # Without an assertion that it was, a regression that stopped reading git —
      # or a future change to the checkout — would leave this job green while the
      # bundle silently lost churn and co-change. That is the §4.2 failure mode:
      # the absence of a measurement reading as a clean bill of health.
      #
      # The commit count is asserted rather than the co-change count. A repository
      # legitimately may have no pair reaching the two-commit threshold, but one
      # that reports zero commits was not read at all.
      - name: History was read
        run: |
          set -euo pipefail
          if grep -qE '^  history not read' coverage.txt; then
            echo "history was not read despite fetch-depth: 0"
            cat coverage.txt
            exit 1
          fi
          # A shallow clone yields real but truncated signals, and the warning names
          # the fix. It must never appear here, because the checkout is unshallow.
          if grep -q 'fetch-depth' coverage.txt; then
            echo "history read as shallow despite fetch-depth: 0"
            cat coverage.txt
            exit 1
          fi
          commits="$(sed -n 's/^  history: \([0-9]*\) commits.*/\1/p' coverage.txt)"
          echo "commits=${commits:-<none>}"
          if [ -z "$commits" ] || [ "$commits" -lt 1 ]; then
            echo "no history line, or zero commits, in the coverage report"
            cat coverage.txt
            exit 1
          fi
          echo "history read across ${commits} commit(s)"

      # -no-history must produce a complete structural bundle: history is additive
      # (§4.4), so the deterministic core cannot depend on it. Asserted by node
      # count rather than exit code, because a run that silently produced an empty
      # graph would also exit 0.
      - name: Structure is complete without history
        run: |
          set -euo pipefail
          ./signpost export -format json -quiet -no-history . > nohist.json
          nodes="$(jq '.nodes | length' nohist.json)"
          full="$(jq '.nodes | length' graph.json)"
          echo "nodes without history=${nodes}, with=${full}"
          [ "$nodes" -eq "$full" ] || {
            echo "history changed the node count; it must only annotate"
            exit 1
          }
          # Co-change is the one thing that should disappear, which is also the check
          # that the flag does something rather than being silently ignored.
          co="$(jq '[.edges[] | select(.kind == "co_changes")] | length' nohist.json)"
          [ "$co" -eq 0 ] || { echo "${co} co-change edge(s) survived -no-history"; exit 1; }

      # Last, because it writes into the checkout. The three properties asserted
      # here are the ones that make a committed bundle safe to adopt, and each is
      # a defect a unit test could pass while the binary got wrong:
      #
      #   - Byte-stability across two runs of the real binary. §8.1: the bundle is
      #     committed, so unstable output is a diff in someone else's repository on
      #     every build.
      #   - A human edit outside the managed markers survives a rebuild. This is
      #     the mechanism the whole design compounds on; if it breaks, the tool
      #     teaches people to stop correcting it.
      #   - Markdown and JSON only, nothing executable. CI writing into a
      #     repository is a supply-chain position in every repository that adopts
      #     signpost, and ADR 0005 bounds the worst case to ugly strings in a .md.
      - name: Bundle is stable, preserves edits, and ships nothing executable
        run: |
          set -euo pipefail
          # The same flags on every run below. -repo feeds each page's resource:
          # URI, so a second run without it would legitimately produce different
          # bytes and the diff would report a determinism failure that is really a
          # difference in what was asked for.
          repo="github.com/${GITHUB_REPOSITORY}"
          ./signpost build -quiet -repo "$repo" . >build1.txt
          cat build1.txt
          # Outside the checkout: a copy left in the tree is content the second run
          # would discover, so the comparison would change the thing it measures.
          cp -r .signpost "${RUNNER_TEMP}/first"
          ./signpost build -quiet -repo "$repo" . >/dev/null
          if ! diff -r "${RUNNER_TEMP}/first" .signpost; then
            echo "the bundle is not byte-identical across two runs"
            exit 1
          fi
          echo "bundle: identical across two runs"

          # A glob rather than `ls | head`: the shell sorts it, so the page picked
          # is the same on every run, and no filename is passed through a pipe.
          set -- .signpost/modules/*.md
          page="$1"
          note='SENTINEL: a human wrote this outside the managed markers.'
          printf '\n%s\n' "$note" >>"$page"
          ./signpost build -quiet -repo "$repo" . >build3.txt
          grep -qF "$note" "$page" || {
            echo "a human edit to ${page} was lost by a rebuild"
            exit 1
          }
          grep -q 'human notes, carried across' build3.txt || {
            echo "the run did not report carrying an edit:"
            cat build3.txt
            exit 1
          }
          echo "bundle: human edit preserved and reported"

          bad="$(find .signpost -type f ! -name '*.md' ! -name '*.json' -print)"
          [ -z "$bad" ] || { echo "non-markdown files in the bundle:"; echo "$bad"; exit 1; }
          exec="$(find .signpost -type f -perm -u+x -print)"
          [ -z "$exec" ] || { echo "executable files in the bundle:"; echo "$exec"; exit 1; }
          echo "bundle: markdown and JSON only, nothing executable"

      # verify's only interface is its exit code, so this step asserts both
      # directions of it. The positive case alone would pass on a `verify` that
      # returned 0 unconditionally, which is precisely the failure design §4.6
      # calls worse than having no check: a staleness gate that cannot fail
      # teaches people to trust a bundle nobody validated.
      #
      # Runs on the bundle the previous step left behind, human sentinel edit
      # included — a verify that went red on someone's notes is a verify they
      # disable, and then the staleness check goes with it.
      - name: Verify passes on a current bundle, and fails on a stale one
        run: |
          set -euo pipefail
          repo="github.com/${GITHUB_REPOSITORY}"
          # Output goes outside the checkout, as in the step above: a file written
          # into the tree is content signpost discovers, so it would be part of
          # the tree being verified but not of the bundle being verified against.
          out="${RUNNER_TEMP}/verify1.txt"
          # `|| ok=$?` rather than a bare call: under `set -e` a failing verify
          # would abort the step before the output is printed, and then the log
          # says a gate failed without saying what it found.
          ok=0
          ./signpost verify -quiet -repo "$repo" . >"$out" || ok=$?
          cat "$out"
          [ "$ok" -eq 0 ] || {
            echo "verify failed on the bundle this job just built"
            exit 1
          }
          # The counts are the evidence the pass means something. "ok" over zero
          # pages and "ok" over every page read the same in a log, so the floor
          # is asserted rather than assumed.
          pages="$(sed -n 's/^  checked \([0-9]*\) page(s).*/\1/p' "$out")"
          [ -n "$pages" ] && [ "$pages" -ge 10 ] || {
            echo "verify reported ${pages:-no} page(s) checked; a pass over nothing is not a pass"
            exit 1
          }
          echo "verify: ${pages} page(s) checked, exit 0"

          # Now make the bundle wrong and require a non-zero exit. A new package
          # is a concept the bundle has no page for, which is the exact case a
          # pull request creates and the reason the check exists.
          mkdir -p internal/ciprobe
          printf 'package ciprobe\n\n// Probe exists to make the bundle stale.\nfunc Probe() {}\n' \
            >internal/ciprobe/ciprobe.go
          if ./signpost verify -quiet -repo "$repo" . >"${RUNNER_TEMP}/verify2.txt"; then
            echo "verify exited 0 on a stale bundle — the gate cannot fail, so it is not a gate"
            cat "${RUNNER_TEMP}/verify2.txt"
            exit 1
          fi
          cat "${RUNNER_TEMP}/verify2.txt"
          rm -rf internal/ciprobe
          echo "verify: non-zero on a stale bundle"

  corpus:
    name: corpus (a repository signpost did not write)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # The dogfood job above runs signpost on signpost, and that has a ceiling this job
      # exists to clear. This tree is Go with kebab-case filenames, so self-hosting cannot
      # reach the TypeScript, Python, or Rust extractors, cannot reach an npm, Cargo, or
      # pyproject manifest, and cannot reach a path containing a character that is an
      # indicator in YAML. Issue #9 was the last one: a Next.js dynamic route written
      # unquoted into a flow mapping made four pages unreadable from that line down, and
      # every unit test and the dogfood job stayed green.
      #
      # testdata/corpus is a synthetic repository with all four languages and the paths that
      # break naive emitters. `go test ./cmd/signpost -run TestCorpus` runs it in-process on
      # all three platforms in the test job; this job is what that cannot do — check the
      # emitted YAML with an independent conforming parser, below.
      - name: Build
        run: go build -o signpost ./cmd/signpost

      # A git repository, because signpost reads history and the corpus's own directory
      # inside this checkout carries signpost's commits rather than the corpus's. Outside
      # the checkout, because `build` writes .signpost/ and a second bundle in this tree is
      # something the staleness check would compare against the wrong repository.
      - name: Stage the corpus as its own repository
        run: |
          set -euo pipefail
          corpus="${RUNNER_TEMP}/corpus"
          cp -r testdata/corpus "$corpus"
          git -C "$corpus" init --quiet --initial-branch=main
          git -C "$corpus" config user.name "Corpus Author"
          git -C "$corpus" config user.email "corpus@example.invalid"
          git -C "$corpus" add -A
          GIT_AUTHOR_DATE=2026-01-01T00:00:00Z GIT_COMMITTER_DATE=2026-01-01T00:00:00Z \
            git -C "$corpus" commit --quiet -m "the corpus"

      - name: Build and verify the corpus bundle
        run: |
          set -euo pipefail
          corpus="${RUNNER_TEMP}/corpus"
          ./signpost build -repo example.com/corpus "$corpus" | tee "${RUNNER_TEMP}/build.txt"
          ok=0
          ./signpost verify -quiet -repo example.com/corpus "$corpus" \
            >"${RUNNER_TEMP}/verify.txt" || ok=$?
          cat "${RUNNER_TEMP}/verify.txt"
          [ "$ok" -eq 0 ] || { echo "verify rejected a bundle signpost just wrote"; exit 1; }

      # The check no Go test here can make. signpost's own reader is tolerant by design
      # (ADR 0001), so it is the wrong instrument for proving output is well-formed: it is
      # built to keep reading past things a conforming parser rejects. PyYAML is a
      # conforming parser and has no stake in signpost being right.
      #
      # This is the assertion issue #9 could not have survived, and the only one here that
      # does not depend on somebody having thought of the offending character in advance.
      # Every path-injection defect so far — a newline, a backtick, a `](`, then a bracket —
      # was found by a person imagining the character, and that does not scale.
      - name: Every page's frontmatter parses under a conforming YAML reader
        run: |
          set -euo pipefail
          python3 - "${RUNNER_TEMP}/corpus/.signpost" <<'PY'
          import pathlib, sys, yaml

          # Every key the emitter puts in an edge mapping. A key outside this set means a
          # scalar terminated early and the rest of it became a key of its own, which is what
          # an unquoted comma in a path does. Kept as an explicit set rather than derived, so
          # adding a field to the emitter is a deliberate edit here.
          EDGE_KEYS = {"kind", "to", "confidence", "weight", "source"}

          root = pathlib.Path(sys.argv[1])
          pages = sorted(root.rglob("*.md"))
          if len(pages) < 10:
              sys.exit(f"only {len(pages)} page(s) under {root}; the build wrote nothing")

          failed = []
          for page in pages:
              text = page.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  failed.append((page, "no frontmatter fence"))
                  continue
              end = text.find("\n---\n", 3)
              if end < 0:
                  failed.append((page, "unterminated frontmatter fence"))
                  continue
              block = text[4:end + 1]
              try:
                  doc = yaml.safe_load(block)
              except yaml.YAMLError as err:
                  failed.append((page, str(err).replace("\n", " ")))
                  continue
              if not isinstance(doc, dict):
                  failed.append((page, f"frontmatter is {type(doc).__name__}, not a mapping"))
                  continue
              # The field issue #9 destroyed, checked by key set rather than by parseability.
              #
              # Parsing alone is not enough, and a comma proves it: an unquoted `[` raises,
              # but an unquoted `,` inside a flow mapping parses *clean* and silently splits
              # the scalar — `source: py/greeter/data,notes.py` reads back as
              # `source: py/greeter/data` plus an invented `notes.py: None` key. A check for
              # "did it parse" and even "does it have a kind" both pass on that. An
              # unexpected key does not, and it needs no advance knowledge of the character.
              for edge in doc.get("edges") or []:
                  if not isinstance(edge, dict):
                      failed.append((page, f"an edge read back as {edge!r}"))
                      continue
                  unknown = set(edge) - EDGE_KEYS
                  if unknown or "kind" not in edge:
                      failed.append((page, f"an edge read back with keys {sorted(edge)}, "
                                           f"which is a scalar that split: {edge!r}"))

          for page, why in failed:
              print(f"{page.relative_to(root)}: {why}")
          if failed:
              sys.exit(f"\n{len(failed)} page(s) emitted YAML a conforming reader cannot read")
          print(f"{len(pages)} page(s): frontmatter parses, every edge read back as a mapping")
          PY

      # The paths the corpus exists for, asserted by name. The parse check above would catch
      # an unquoted bracket, but it would not say which path caused it, and a future emitter
      # that dropped the hostile pages entirely would leave it green.
      - name: The hostile paths reached the bundle
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/corpus/.signpost"
          fail=0
          for p in 'app/tools/\[slug\]/page.tsx' 'app/blog/\[\.\.\.rest\]/page.tsx' 'greeter/data,notes.py'; do
            if ! grep -rq "$p" "$bundle"; then
              echo "no page mentions ${p}; the corpus fixture or the extractor changed"
              fail=1
            fi
          done
          exit "$fail"

  security:
    name: security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history, which needs all of it. A secret removed from the
          # tip but still reachable in an earlier commit is still leaked.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -quiet ./...

      - name: gitleaks
        run: |
          version=8.30.1
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --verbose

  dependencies:
    name: dependency gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate compares this branch's direct dependencies against the base, so
          # it needs the base commit.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Tidy is committed
        # A go.mod or go.sum that differs from what `go mod tidy` produces means the
        # dependency list in the repository is not the one the build actually uses,
        # which makes every statement below it unverifiable.
        #
        # Compared through git rather than by copying files aside: signpost has no
        # go.sum today, and a `[ -f go.sum ]` test under `set -e` would fail the step
        # on the absence rather than skip the check.
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result"
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: A new direct dependency requires an ADR
        # §8: this gate is the mechanism that keeps the dependency list short enough
        # for bumping to stay routine. Without it, "few dependencies, each justified"
        # decays within a quarter — every individual addition looks reasonable, and
        # nobody is reviewing the total.
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Direct requirements only. `// indirect` marks the transitive set, which
          # arrives as a consequence of a direct choice and is not itself one. The
          # marker is a comment, which is exactly what distinguishes the two, so the
          # require block is read directly rather than through `go mod edit -json` —
          # that would need the base go.mod checked out as a module directory.
          requires() {
            awk '/^require \(/ {block=1; next}
                 /^\)/          {block=0}
                 block && NF && !/\/\/ indirect/ {print $1}
                 /^require [^(]/ && !/\/\/ indirect/ {print $2}' "$1" | sort -u
          }

          # An empty file when the base has no go.mod at all, so a first-commit case
          # reports every requirement as new rather than failing on a missing object.
          git show "${BASE}:go.mod" > /tmp/base.mod 2>/dev/null || : > /tmp/base.mod
          requires /tmp/base.mod > /tmp/base.direct
          requires go.mod > /tmp/head.direct

          added="$(comm -13 /tmp/base.direct /tmp/head.direct)"
          if [ -z "$added" ]; then
            echo "no new direct dependencies"
            exit 0
          fi

          echo "new direct dependencies in this pull request:"
          echo "$added"

          # An ADR must be added or modified in the same pull request. Requiring it
          # here rather than in review is the point: a reviewer looking at one
          # plausible dependency has no view of the total, and the ADR is where the
          # justification becomes reviewable later.
          if git diff --name-only "${BASE}...HEAD" | grep -q '^docs/adr/.*\.md$'; then
            echo "an ADR accompanies this change"
            exit 0
          fi
          echo
          echo "A new direct dependency needs an ADR in docs/adr/ (see CONTRIBUTING.md)."
          echo "State what the dependency buys and what the stdlib alternative costs."
          exit 1
