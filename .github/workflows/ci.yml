name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a vulnerability disclosed against a dependency is found by a
  # scheduled run rather than by whatever unrelated pull request happens to come
  # next.
  schedule:
    - cron: "23 6 * * 1"

# Read-only by default; no job here needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    # Three platforms is not redundancy. Discovery normalises CRLF at ingest and
    # matches gitignore patterns case-sensitively on every platform so a Windows
    # checkout and a Linux runner produce identical bundles (§8.1). A
    # single-platform matrix would let exactly that regress silently.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned by commit SHA, not tag (§8 dependency governance). A tag
      # is mutable and has been moved in a real supply-chain compromise; a SHA is
      # the artifact itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Twice. signpost's output is committed to the repositories it analyses, so
      # nondeterministic output is commit churn in someone else's repo. Several
      # packages render freshly built graphs five times and compare bytes; a second
      # run exercises them under a different map seed.
      #
      # The timeout is raised from the 10-minute default because internal/vcs shells out
      # to the real git binary for every case, twice, and a Windows runner is slow enough
      # at process creation that the default is not a comfortable margin. A hang should
      # still fail rather than run to the job limit, so this is raised, not removed.
      - name: Test
        run: go test -count=2 -timeout 30m ./...

      - name: Test with the race detector
        # Linux only, once. The pipeline is single-goroutine today, so this guards a
        # future change rather than a per-platform concern, and the detector costs
        # roughly an order of magnitude in runtime.
        if: matrix.os == 'ubuntu-24.04'
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "these files are not gofmt'd:"
            echo "$out"
            exit 1
          fi

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          staticcheck ./...

      - name: shellcheck the installer
        # install.sh is piped from the network straight into a shell. A portability
        # bug there is a failed install on somebody's machine with no way to debug
        # it, so it is linted as POSIX sh rather than bash.
        run: shellcheck --shell=sh install.sh

      - name: installers are pure ASCII
        # Not style: PowerShell 5.1 decodes a BOM-less script as Windows-1252, so a
        # UTF-8 em dash arrives as three characters ending in U+201D — a right double
        # quotation mark the 5.1 parser accepts as a string terminator. The string
        # closes early and the file fails to parse lines away from the real cause.
        # This shipped once, in a script users pipe from the network into a shell,
        # because the parse check below originally ran only under pwsh 7.
        #
        # No grep -P: it is unavailable in some builds and errors out under LC_ALL=C
        # in others, and `if grep ...` reads that error as "nothing found" — a gate
        # that cannot fail. The exit code is checked explicitly for the same reason:
        # 1 is a clean file, 0 is a finding, anything else is a broken check.
        run: |
          set -uo pipefail
          # A literal tab inside the bracket expression; everything else must be a
          # printable ASCII character. Newlines are never part of a grep line.
          LC_ALL=C grep -n '[^	 -~]' install.sh install.ps1 && rc=0 || rc=$?
          case "$rc" in
            1) echo "both installers are pure ASCII" ;;
            0) echo "the lines above contain non-ASCII bytes; installers must stay ASCII"
               exit 1 ;;
            *) echo "the ASCII check itself failed with exit $rc"
               exit 1 ;;
          esac

  commits:
    name: commit trailers name real issues
    runs-on: ubuntu-24.04
    # The only job that reads the issue tracker. Scoped here rather than raised at the
    # workflow level so the other eight jobs keep `contents: read` and nothing else.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check reads commit messages over a range, so it needs the commits at
          # both ends. A pull_request checkout is shallow by default and the base sha
          # would not be present.
          fetch-depth: 0

      - name: commit references an issue that exists
        # `Closes #29` in a merged commit is an instruction GitHub acts on, and a
        # number GitHub cannot resolve is a link to a 404 sitting in the permanent
        # record. This shipped once: commit 2785918 carries `Closes #29` and
        # `Closes #35` from a local task list, in a repository whose issues stop at
        # #14. Nothing closed, and the history is not being rewritten to fix it:
        # rewriting that commit rewrites the bundle commit behind it, and ADR 0007
        # puts the provenance stamp inside the bytes, so 53 pages would end up naming
        # a sha that no longer exists — a wrong link in a message traded for a
        # dangling identifier in the artifact. Forward-only, which is this step.
        #
        # Asked of the API rather than compared against a highest-known number. A
        # ceiling read from `gh issue list` is stale the moment somebody files
        # something, and it cannot catch a number *below* it that still resolves to
        # nothing — a deleted issue, or one transferred to another repository. The
        # endpoint also covers pull requests, which share the sequence, so a `Fixes`
        # on a PR number is accepted as the valid reference it is.
        #
        # Only the bare `#n` form is checked, and it is the *keyword* that makes it a
        # reference, not the position. GitHub reads closing keywords anywhere in the
        # message, so there is no "quoting it in prose" — the first version of this
        # step failed on its own commit, which described the bug by writing
        # `Closes #29` in a paragraph. That is the check being right: had #29 existed,
        # the sentence explaining the defect would have closed it. Discuss a bad
        # trailer without re-arming it, by naming the commit instead of the keyword.
        #
        # `owner/repo#n` and a full issue URL are not checked, and that is a scope
        # limit rather than a claim they are inert: both do close, in the repository
        # they name, which this step cannot vouch for — the token is scoped to this
        # one. A number this repository cannot resolve is correct there.
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          empty=0000000000000000000000000000000000000000
          if [ -z "$BASE" ] || [ "$BASE" = "$empty" ]; then
            # A scheduled run, a first push to a branch, or a manual dispatch: no range
            # exists. Checking the whole history instead would fail on 2785918 forever.
            echo "no commit range for this event; nothing to check"
            exit 0
          fi
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            shas=$(git rev-list "${BASE}..${HEAD_SHA}") || {
              echo "could not list ${BASE}..${HEAD_SHA}; the check itself failed"
              exit 1
            }
          else
            # A force-push: `before` names a commit that was rewritten away and is not
            # in this checkout. The tip is still worth checking, and narrowing to it is
            # better than either failing on a range that cannot exist or skipping
            # silently, which would let a bad trailer through on exactly the push that
            # rewrote it.
            echo "${BASE} is not in this checkout; checking ${HEAD_SHA} alone"
            shas=$HEAD_SHA
          fi
          [ -n "$shas" ] || { echo "no new commits in ${BASE}..${HEAD_SHA}"; exit 0; }

          fail=0
          checked=0
          for sha in $shas; do
            # GitHub's closing keywords, case-insensitive, with the optional colon it
            # accepts. The reference has to follow the keyword directly, which is why
            # `owner/repo#n` does not match: `owner` sits between them.
            #
            # `\b` on the left, because without it `unfixed #99` and `discloses #99`
            # match and this step fails a build over prose GitHub ignores — the wrong
            # direction for a gate, since a false alarm is what gets one switched off.
            refs=$(git log -1 --format=%B "$sha" \
              | grep -Eio '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]*#[0-9]+' \
              | grep -Eo '[0-9]+' | sort -un) || true
            for n in $refs; do
              checked=$((checked + 1))
              if out=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${n}" --jq '.number' 2>&1); then
                echo "${sha:0:7} closes #${out}, which exists"
              elif printf '%s' "$out" | grep -q '404'; then
                echo "${sha:0:7} says it closes #${n}, and #${n} does not exist in"
                echo "${GITHUB_REPOSITORY}. GitHub renders that as a link to a 404 and"
                echo "closes nothing. If the number came from a planner or another"
                echo "tracker, name it without a closing keyword — the keyword is what"
                echo "makes it a reference, and it works anywhere in the message, so"
                echo "there is no position that quotes one safely."
                fail=1
              else
                # A rate limit or a revoked token must not read as a clean message.
                echo "the existence check for #${n} failed rather than answering: ${out}"
                exit 1
              fi
            done
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "${checked} closing reference(s) across $(echo "$shas" | wc -l) commit(s), each resolvable"

  installer:
    name: installer parses (5.1 and 7)
    # A Windows runner because that is the only place PowerShell 5.1 exists, and 5.1
    # is what an `iex (irm ...)` line lands in on a default Windows box. Parsing only
    # under pwsh 7 let a script through that 5.1 could not parse at all.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse under Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1).Path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "5.1: parsed clean"

      - name: Parse under PowerShell 7
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1).Path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "7: parsed clean"

  dogfood:
    name: signpost analyses signpost
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Git signals read history. A shallow clone would make co-change and
          # churn silently thin rather than absent, which is the failure mode
          # this repository is built to refuse.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build -o signpost ./cmd/signpost

      # The CLI's shape is a rule, not a layout: a noun with more than one
      # operation is a group, a noun with one is flat, and a group's own name is
      # never an action. Go tests assert it, and it is asserted again here on the
      # real binary, because this is the surface a released artifact promises and
      # the failure mode is silent — a later change gives a group a default verb,
      # `signpost graph .` starts analysing again, and the rule becomes a comment
      # describing something untrue.
      #
      # The renamed-verb notes are checked in the same step. They are the only
      # thing owed to somebody whose shell history predates v0.2.0, since neither
      # old spelling kept a working alias.
      - name: The command surface holds
        run: |
          set -euo pipefail
          fail=0
          # Under ${RUNNER_TEMP}, not the workspace: the steps after this one
          # analyse this repository and assert on its file census, so a scratch
          # file dropped here would be counted as repository content.
          err="${RUNNER_TEMP}/surface.txt"

          # Every one of these must exit 2, not merely non-zero. The 2-versus-1
          # split is the contract with CI — 2 means the command line was wrong, 1
          # means signpost ran and what it found was the problem — so a misuse
          # that started exiting 1 would be reported as a broken repository.
          check() {
            local want_frag="$1" desc="$2"; shift 2
            local code=0
            ./signpost "$@" >/dev/null 2>"$err" || code=$?
            if [ "$code" -ne 2 ]; then
              echo "signpost $*: exit ${code}, want 2 — ${desc}"
              cat "$err"
              fail=1
              return
            fi
            grep -q "$want_frag" "$err" || {
              echo "signpost $*: stderr does not ${desc}"
              cat "$err"
              fail=1
            }
          }

          # A group must not run something, and must offer its subcommands rather
          # than dead-ending.
          check '<command>' 'print the group usage' graph
          check 'show'       "offer show"           graph
          check '<command>' 'print the group usage' model
          check 'check'      "offer check"          model
          check '<command>' 'print the group usage' hooks
          check 'install'    "offer install"        hooks

          # A renamed verb says where it went. `export` is unknown now; `graph .`
          # parses as a group handed a path, which is exactly the v0.1.0 spelling.
          check 'signpost graph export' "name the new spelling of export" export .
          check 'signpost graph show'   'say the group used to be a command'  graph .

          # And a typo gets its one suggestion, asserted on the real command table
          # because that is the only place the hint is worth anything.
          check 'signpost verify' "suggest verify" verfiy .

          # Requested help is an answer, not a misuse: exit 0, on stdout, at every
          # level. The unit tests assert this too; it is repeated here because it
          # is the one part of the surface a person consumes through a pipe, and
          # `signpost graph show -h | less` showing nothing is not a test failure
          # anywhere — it is a silent one.
          helps() {
            local code=0 out
            out="$(./signpost "$@" -h 2>"$err")" || code=$?
            if [ "$code" -ne 0 ]; then
              echo "signpost $* -h: exit ${code}, want 0"
              cat "$err"
              fail=1
              return
            fi
            [ -n "$out" ] || { echo "signpost $* -h: nothing on stdout"; fail=1; }
            [ ! -s "$err" ] || {
              echo "signpost $* -h: wrote to stderr"
              cat "$err"
              fail=1
            }
          }

          helps
          helps graph
          helps model
          helps hooks
          helps build
          helps verify
          helps graph show
          helps graph export
          helps model check
          helps hooks install
          helps hooks uninstall
          helps hooks run

          # The hook reports and never gates. That division is what makes the hook
          # safe to install, and it is asserted on the real binary because the
          # failure is invisible from a terminal: `hooks run` exiting non-zero on a
          # stale bundle would put a red line in every developer's shell after
          # every commit, and the unit test that covers it would still pass if the
          # exit code were mapped somewhere between the command and the process.
          #
          # Run on the bundle this job just verified, so the answer is "current"
          # and the assertion is only about the exit code.
          for mode in fast verify; do
            code=0
            ./signpost hooks run -check "$mode" . >/dev/null 2>"$err" || code=$?
            if [ "$code" -ne 0 ]; then
              echo "signpost hooks run -check ${mode}: exit ${code}, want 0 — the hook must never gate"
              cat "$err"
              fail=1
            fi
          done

          # And an unusable check mode is a misuse rather than a silent fall back
          # to the cheap check, which would report "current" from a check that
          # never ran.
          check 'verify' 'name the modes it accepts' hooks run -check quick .

          # A .signpost.yml signpost cannot use is exit 2 and no bundle, on every
          # command that reads one. Asserted on the real binary because the exit
          # code is the whole contract here: a fall back to defaults would build a
          # bundle nobody's configuration asked for and exit 0, and the file that
          # was supposed to shape it would be a file somebody wrote for nothing.
          #
          # In its own directory under ${RUNNER_TEMP}, for two reasons. A
          # .signpost.yml in the workspace would be counted by the census steps
          # below and would shape the bundle this job verifies; and the file has to
          # be at a repository root by design, so there is nowhere else to put it.
          cfgdir="${RUNNER_TEMP}/cfg"
          mkdir -p "$cfgdir"
          printf 'package main\n\nfunc main() {}\n' > "${cfgdir}/main.go"

          # Second class: a key deciding whether a check fails. The one that must
          # never become settable, and the one a diff would try.
          printf 'fail_on_cycle: false\n' > "${cfgdir}/.signpost.yml"
          for verb in build verify "graph show"; do
            # shellcheck disable=SC2086
            check 'fail_on_cycle' 'name the refused key' $verb -quiet "$cfgdir"
          done
          [ ! -d "${cfgdir}/.signpost" ] || {
            echo "a bundle was written from a config that was refused"
            fail=1
          }

          # And a file signpost cannot read. Tab indentation on purpose: it is a
          # construct the manifest readers tolerate by design, since they read
          # other tools' files and one odd line must not fail a build. For
          # signpost's own file it is exit 2, because stepping over it would mean
          # analysing the tree the way the file said not to and reporting success.
          printf 'hooks:\n\tcheck: verify\n' > "${cfgdir}/.signpost.yml"
          check '.signpost.yml' 'name the file it could not read' build -quiet "$cfgdir"
          rm -rf "$cfgdir"

          [ "$fail" -eq 0 ] || exit 1
          echo "the command surface is intact"

      # Running the binary on this repository is the only check that exercises
      # discovery, extraction, manifest reading, resolution, clustering, and
      # export together against a real tree rather than a fixture. Every unit
      # test here passed on both installer bugs shipped in v0.0.1, because a
      # test suite only covers what someone thought to assert.
      - name: Analyse this repository
        run: |
          set -euo pipefail
          ./signpost graph show . 2>coverage.txt
          cat coverage.txt

      # Not a smoke test. `graph` exits 0 on an empty graph, so asserting the exit
      # code alone would pass if extraction silently stopped working. The floors
      # are deliberately well under the current numbers (15 nodes, 17 edges) so
      # ordinary growth never touches them and a collapse always does.
      #
      # Counted through jq rather than by grepping for '"id":', because attribute
      # keys come from the analysed repository: a repo with an attr named `id`
      # would inflate a grep count. jq failing is also the check that the export
      # is valid JSON, which no other step here establishes.
      - name: Coverage floors hold
        run: |
          set -euo pipefail
          ./signpost graph export -format json -quiet . > graph.json
          nodes="$(jq '.nodes | length' graph.json)"
          edges="$(jq '.edges | length' graph.json)"
          echo "nodes=${nodes} edges=${edges}"
          fail=0
          [ "$nodes" -ge 10 ] || { echo "only ${nodes} nodes; extraction has regressed"; fail=1; }
          [ "$edges" -ge 8 ] || { echo "only ${edges} edges; resolution has regressed"; fail=1; }
          # Module nodes specifically, because the total would stay above its floor
          # on manifest-derived nodes alone even if source discovery stopped
          # walking entirely. Five against a current seven: enough headroom that
          # merging two packages is not a build failure, low enough that losing
          # source discovery is.
          mods="$(jq '[.nodes[] | select(.kind == "Module")] | length' graph.json)"
          echo "module nodes=${mods}"
          [ "$mods" -ge 5 ] || { echo "only ${mods} module nodes; discovery has regressed"; fail=1; }
          # Confidence is the distinction the whole tool rests on. Nothing in the
          # deterministic pass may emit an inferred edge (§4.4); only the semantic
          # pass is permitted to, and it does not run here.
          guessed="$(jq '[.edges[] | select(.confidence != "extracted")] | length' graph.json)"
          [ "$guessed" -eq 0 ] || {
            echo "${guessed} edge(s) are not 'extracted' in a run with no model:"
            jq '[.edges[] | select(.confidence != "extracted")]' graph.json
            fail=1
          }
          exit "$fail"

      # The property §8.1 rests on: the bundle gets committed, so identical
      # input producing different bytes is commit churn in someone else's
      # repository. Tested in-process by several packages; this runs the whole
      # binary twice, which is what a user actually does.
      - name: Output is byte-identical across runs
        run: |
          set -euo pipefail
          for fmt in mermaid dot graphml json; do
            ./signpost graph export -format "$fmt" -quiet . > "a.${fmt}"
            ./signpost graph export -format "$fmt" -quiet . > "b.${fmt}"
            if ! cmp -s "a.${fmt}" "b.${fmt}"; then
              echo "${fmt} export is not deterministic:"
              diff "a.${fmt}" "b.${fmt}" | head -20
              exit 1
            fi
            echo "${fmt}: identical across two runs"
          done

      # signpost reports what it could not read, and that report is load-bearing
      # (§4.2). A coverage line claiming zero unresolved imports in a repository
      # that has them would be the tool lying about its own gaps, so the shape of
      # the report is checked rather than assumed.
      - name: Coverage report names its gaps
        run: |
          set -euo pipefail
          if ! grep -q '^analysed [0-9]* files: [0-9]* nodes, [0-9]* edges$' coverage.txt; then
            echo "coverage report is missing or malformed:"
            cat coverage.txt
            exit 1
          fi
          # This repository has one .sh and one .ps1, neither of which signpost
          # has an extractor for. It must say so. If someone adds those
          # extractors, this line is the reminder to update the assertion.
          if ! grep -q 'no extractor for' coverage.txt; then
            echo "expected an unhandled-language line for install.sh/install.ps1"
            cat coverage.txt
            exit 1
          fi
          # And the other admission, which is a different one. The line above says
          # signpost knows what PowerShell is and cannot read it; this says it could
          # not tell what the file was, so no reader was offered it at all. This tree
          # has site/*.html, site/*.css, LICENSE, and CNAME — none of which is a
          # recognised kind — so silence here means the count stopped being taken.
          # It went untaken for the whole of v0.1.0: the classification was written in
          # one place and read in none.
          if ! grep -q 'file(s) of no recognised kind' coverage.txt; then
            echo "expected an unclassified-file line for site/*.html, LICENSE, CNAME"
            cat coverage.txt
            exit 1
          fi
          # Not folded into one line. A single line naming both would satisfy the two
          # greps above while losing the distinction they exist to draw, so each is
          # checked for the other's extensions.
          if sed -n 's/^  no extractor for: //p' coverage.txt | grep -q '\.html'; then
            echo "an unclassified extension is on the no-extractor line"
            cat coverage.txt
            exit 1
          fi
          if sed -n 's/^  [0-9]* file(s) of no recognised kind: //p' coverage.txt | grep -q '\.ps1'; then
            echo "an unhandled language is on the unclassified line"
            cat coverage.txt
            exit 1
          fi
          echo "coverage report is well-formed and names its gaps"

      # The checkout above sets fetch-depth: 0 specifically so history can be read.
      # Without an assertion that it was, a regression that stopped reading git —
      # or a future change to the checkout — would leave this job green while the
      # bundle silently lost churn and co-change. That is the §4.2 failure mode:
      # the absence of a measurement reading as a clean bill of health.
      #
      # The commit count is asserted rather than the co-change count. A repository
      # legitimately may have no pair reaching the two-commit threshold, but one
      # that reports zero commits was not read at all.
      - name: History was read
        run: |
          set -euo pipefail
          if grep -qE '^  history not read' coverage.txt; then
            echo "history was not read despite fetch-depth: 0"
            cat coverage.txt
            exit 1
          fi
          # A shallow clone yields real but truncated signals, and the warning names
          # the fix. It must never appear here, because the checkout is unshallow.
          if grep -q 'fetch-depth' coverage.txt; then
            echo "history read as shallow despite fetch-depth: 0"
            cat coverage.txt
            exit 1
          fi
          commits="$(sed -n 's/^  history: \([0-9]*\) commits.*/\1/p' coverage.txt)"
          echo "commits=${commits:-<none>}"
          if [ -z "$commits" ] || [ "$commits" -lt 1 ]; then
            echo "no history line, or zero commits, in the coverage report"
            cat coverage.txt
            exit 1
          fi
          echo "history read across ${commits} commit(s)"

      # -no-history must produce a complete structural bundle: history is additive
      # (§4.4), so the deterministic core cannot depend on it. Asserted by node
      # count rather than exit code, because a run that silently produced an empty
      # graph would also exit 0.
      - name: Structure is complete without history
        run: |
          set -euo pipefail
          ./signpost graph export -format json -quiet -no-history . > nohist.json
          nodes="$(jq '.nodes | length' nohist.json)"
          full="$(jq '.nodes | length' graph.json)"
          echo "nodes without history=${nodes}, with=${full}"
          [ "$nodes" -eq "$full" ] || {
            echo "history changed the node count; it must only annotate"
            exit 1
          }
          # Co-change is the one thing that should disappear, which is also the check
          # that the flag does something rather than being silently ignored.
          co="$(jq '[.edges[] | select(.kind == "co_changes")] | length' nohist.json)"
          [ "$co" -eq 0 ] || { echo "${co} co-change edge(s) survived -no-history"; exit 1; }

      # Last, because it writes into the checkout. The three properties asserted
      # here are the ones that make a committed bundle safe to adopt, and each is
      # a defect a unit test could pass while the binary got wrong:
      #
      #   - Byte-stability across two runs of the real binary. §8.1: the bundle is
      #     committed, so unstable output is a diff in someone else's repository on
      #     every build.
      #   - A human edit outside the managed markers survives a rebuild. This is
      #     the mechanism the whole design compounds on; if it breaks, the tool
      #     teaches people to stop correcting it.
      #   - Markdown and JSON only, nothing executable. CI writing into a
      #     repository is a supply-chain position in every repository that adopts
      #     signpost, and ADR 0005 bounds the worst case to ugly strings in a .md.
      - name: Bundle is stable, preserves edits, and ships nothing executable
        run: |
          set -euo pipefail
          # The same flags on every run below. -repo feeds each page's resource:
          # URI, so a second run without it would legitimately produce different
          # bytes and the diff would report a determinism failure that is really a
          # difference in what was asked for.
          repo="github.com/${GITHUB_REPOSITORY}"
          ./signpost build -quiet -repo "$repo" . >build1.txt
          cat build1.txt
          # Outside the checkout: a copy left in the tree is content the second run
          # would discover, so the comparison would change the thing it measures.
          cp -r .signpost "${RUNNER_TEMP}/first"
          ./signpost build -quiet -repo "$repo" . >/dev/null
          if ! diff -r "${RUNNER_TEMP}/first" .signpost; then
            echo "the bundle is not byte-identical across two runs"
            exit 1
          fi
          echo "bundle: identical across two runs"

          # A glob rather than `ls | head`: the shell sorts it, so the page picked
          # is the same on every run, and no filename is passed through a pipe.
          set -- .signpost/modules/*.md
          page="$1"
          note='SENTINEL: a human wrote this outside the managed markers.'
          printf '\n%s\n' "$note" >>"$page"
          ./signpost build -quiet -repo "$repo" . >build3.txt
          grep -qF "$note" "$page" || {
            echo "a human edit to ${page} was lost by a rebuild"
            exit 1
          }
          grep -q 'human notes, carried across' build3.txt || {
            echo "the run did not report carrying an edit:"
            cat build3.txt
            exit 1
          }
          echo "bundle: human edit preserved and reported"

          bad="$(find .signpost -type f ! -name '*.md' ! -name '*.json' -print)"
          [ -z "$bad" ] || { echo "non-markdown files in the bundle:"; echo "$bad"; exit 1; }
          exec="$(find .signpost -type f -perm -u+x -print)"
          [ -z "$exec" ] || { echo "executable files in the bundle:"; echo "$exec"; exit 1; }
          echo "bundle: markdown and JSON only, nothing executable"

      # verify's only interface is its exit code, so this step asserts both
      # directions of it. The positive case alone would pass on a `verify` that
      # returned 0 unconditionally, which is precisely the failure design §4.6
      # calls worse than having no check: a staleness gate that cannot fail
      # teaches people to trust a bundle nobody validated.
      #
      # Runs on the bundle the previous step left behind, human sentinel edit
      # included — a verify that went red on someone's notes is a verify they
      # disable, and then the staleness check goes with it.
      - name: Verify passes on a current bundle, and fails on a stale one
        run: |
          set -euo pipefail
          repo="github.com/${GITHUB_REPOSITORY}"
          # Output goes outside the checkout, as in the step above: a file written
          # into the tree is content signpost discovers, so it would be part of
          # the tree being verified but not of the bundle being verified against.
          out="${RUNNER_TEMP}/verify1.txt"
          # `|| ok=$?` rather than a bare call: under `set -e` a failing verify
          # would abort the step before the output is printed, and then the log
          # says a gate failed without saying what it found.
          ok=0
          ./signpost verify -quiet -repo "$repo" . >"$out" || ok=$?
          cat "$out"
          [ "$ok" -eq 0 ] || {
            echo "verify failed on the bundle this job just built"
            exit 1
          }
          # The counts are the evidence the pass means something. "ok" over zero
          # pages and "ok" over every page read the same in a log, so the floor
          # is asserted rather than assumed.
          pages="$(sed -n 's/^  checked \([0-9]*\) page(s).*/\1/p' "$out")"
          [ -n "$pages" ] && [ "$pages" -ge 10 ] || {
            echo "verify reported ${pages:-no} page(s) checked; a pass over nothing is not a pass"
            exit 1
          }
          echo "verify: ${pages} page(s) checked, exit 0"

          # Now make the bundle wrong and require a non-zero exit. A new package
          # is a concept the bundle has no page for, which is the exact case a
          # pull request creates and the reason the check exists.
          mkdir -p internal/ciprobe
          printf 'package ciprobe\n\n// Probe exists to make the bundle stale.\nfunc Probe() {}\n' \
            >internal/ciprobe/ciprobe.go
          if ./signpost verify -quiet -repo "$repo" . >"${RUNNER_TEMP}/verify2.txt"; then
            echo "verify exited 0 on a stale bundle — the gate cannot fail, so it is not a gate"
            cat "${RUNNER_TEMP}/verify2.txt"
            exit 1
          fi
          cat "${RUNNER_TEMP}/verify2.txt"
          rm -rf internal/ciprobe
          echo "verify: non-zero on a stale bundle"

      # The surplus direction — issue #10, and the one the step above cannot
      # reach. A new package is a concept with no page; this is a page with no
      # concept, and it used to pass both gates in silence: `build` reported
      # `342 page(s): 0 created, 342 updated` over a directory holding 344, and
      # strict `verify` exited 0 with three pages describing modules that were
      # not there. Each carried plausible edges and a `resource:` naming a commit
      # where the code really did exist, which is what makes an orphan more
      # expensive than a missing page rather than less.
      #
      # Both boundaries, because the defect is the pair. A fix that deletes
      # unconditionally satisfies the first half and takes somebody's notes with
      # it the first time a directory is renamed, which is the one failure the
      # emitter is built to prevent. Neither assertion means anything alone.
      #
      # Last in the job, after the sentinel edit above has already been asserted:
      # the bundle here is the one signpost just wrote, so a copied page is a
      # skeleton by construction rather than by this step's idea of one.
      - name: A page whose concept is gone is deleted, unless somebody wrote on it
        run: |
          set -euo pipefail
          repo="github.com/${GITHUB_REPOSITORY}"
          # The glob's *last* match, and the reason is the step above: it appended
          # the SENTINEL note to the first one, so that page is human territory now
          # and a copy of it is correctly kept rather than pruned — the tool being
          # right and the test being wrong. Shell-sorted either way, so the donor is
          # the same on every run.
          set -- .signpost/modules/*.md
          [ "$#" -ge 2 ] || {
            echo "only $# module page(s): the donor would be the sentinel-edited one"
            exit 1
          }
          shift "$(( $# - 1 ))"
          donor="$1"
          skeleton=.signpost/modules/ci-ghost-skeleton.md
          written=.signpost/modules/ci-ghost-written.md
          cp "$donor" "$skeleton"
          cp "$donor" "$written"
          printf '\nKEEPME: the code this describes moved.\n' >>"$written"

          out="${RUNNER_TEMP}/verify3.txt"
          if ./signpost verify -quiet -repo "$repo" . >"$out"; then
            echo "verify exited 0 with a page describing a concept this repository does not have"
            cat "$out"
            exit 1
          fi
          cat "$out"
          # Named, and named at the right severity. A run that failed for some
          # other reason would satisfy the exit code above while leaving the
          # orphan unmentioned, so the page has to appear in the output.
          grep -qF 'ci-ghost-skeleton.md' "$out" || {
            echo "verify did not name the surplus page"
            exit 1
          }
          grep -qF 'ci-ghost-written.md' "$out" || {
            echo "verify did not mention the written-on page, so nothing tells a human it is theirs"
            exit 1
          }
          echo "verify: non-zero on a surplus page, both pages named"

          ./signpost build -quiet -repo "$repo" . >"${RUNNER_TEMP}/build4.txt"
          cat "${RUNNER_TEMP}/build4.txt"
          grep -q 'page(s) removed' "${RUNNER_TEMP}/build4.txt" || {
            echo "build did not report removing anything"
            exit 1
          }
          [ ! -e "$skeleton" ] || {
            echo "the surplus page survived a rebuild, so the bundle still describes a concept that is gone"
            exit 1
          }
          # The negative boundary, and the reason build is allowed to delete at
          # all. Byte-for-byte: a fix that kept the file and rewrote it would lose
          # the same thing more quietly.
          grep -qF 'KEEPME: the code this describes moved.' "$written" || {
            echo "a rename took somebody's notes with it"
            exit 1
          }
          echo "build: surplus page removed, written-on page kept"

          # And the remedy verify named actually resolves it. A gate whose stated
          # fix leaves the gate red is the gate people switch off.
          out="${RUNNER_TEMP}/verify4.txt"
          ok=0
          ./signpost verify -quiet -repo "$repo" . >"$out" || ok=$?
          cat "$out"
          [ "$ok" -eq 0 ] || {
            echo "verify still fails after the rebuild it asked for"
            exit 1
          }
          grep -qF 'ci-ghost-written.md' "$out" || {
            echo "the kept page stopped being reported"
            exit 1
          }
          rm -f "$written"
          echo "verify: green after the rebuild, kept page still warned about"

  corpus:
    name: corpus (a repository signpost did not write)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # The dogfood job above runs signpost on signpost, and that has a ceiling this job
      # exists to clear. This tree is Go with kebab-case filenames, so self-hosting cannot
      # reach the TypeScript, Python, or Rust extractors, cannot reach an npm, Cargo, or
      # pyproject manifest, and cannot reach a path containing a character that is an
      # indicator in YAML. Issue #9 was the last one: a Next.js dynamic route written
      # unquoted into a flow mapping made four pages unreadable from that line down, and
      # every unit test and the dogfood job stayed green.
      #
      # testdata/corpus is a synthetic repository with all four languages and the paths that
      # break naive emitters. `go test ./cmd/signpost -run TestCorpus` runs it in-process on
      # all three platforms in the test job; this job is what that cannot do — check the
      # emitted YAML with an independent conforming parser, below.
      - name: Build
        run: go build -o signpost ./cmd/signpost

      # A git repository, because signpost reads history and the corpus's own directory
      # inside this checkout carries signpost's commits rather than the corpus's. Outside
      # the checkout, because `build` writes .signpost/ and a second bundle in this tree is
      # something the staleness check would compare against the wrong repository.
      - name: Stage the corpus as its own repository
        run: |
          set -euo pipefail
          corpus="${RUNNER_TEMP}/corpus"
          cp -r testdata/corpus "$corpus"
          git -C "$corpus" init --quiet --initial-branch=main
          git -C "$corpus" config user.name "Corpus Author"
          git -C "$corpus" config user.email "corpus@example.invalid"
          git -C "$corpus" add -A
          GIT_AUTHOR_DATE=2026-01-01T00:00:00Z GIT_COMMITTER_DATE=2026-01-01T00:00:00Z \
            git -C "$corpus" commit --quiet -m "the corpus"

      - name: Build and verify the corpus bundle
        run: |
          set -euo pipefail
          corpus="${RUNNER_TEMP}/corpus"
          ./signpost build -repo example.com/corpus "$corpus" | tee "${RUNNER_TEMP}/build.txt"
          ok=0
          ./signpost verify -quiet -repo example.com/corpus "$corpus" \
            >"${RUNNER_TEMP}/verify.txt" || ok=$?
          cat "${RUNNER_TEMP}/verify.txt"
          [ "$ok" -eq 0 ] || { echo "verify rejected a bundle signpost just wrote"; exit 1; }

      # The check no Go test here can make. signpost's own reader is tolerant by design
      # (ADR 0001), so it is the wrong instrument for proving output is well-formed: it is
      # built to keep reading past things a conforming parser rejects. PyYAML is a
      # conforming parser and has no stake in signpost being right.
      #
      # This is the assertion issue #9 could not have survived, and the only one here that
      # does not depend on somebody having thought of the offending character in advance.
      # Every path-injection defect so far — a newline, a backtick, a `](`, then a bracket —
      # was found by a person imagining the character, and that does not scale.
      - name: Every page's frontmatter parses under a conforming YAML reader
        run: |
          set -euo pipefail
          python3 - "${RUNNER_TEMP}/corpus/.signpost" <<'PY'
          import pathlib, sys, yaml

          # Every key the emitter puts in an edge mapping. A key outside this set means a
          # scalar terminated early and the rest of it became a key of its own, which is what
          # an unquoted comma in a path does. Kept as an explicit set rather than derived, so
          # adding a field to the emitter is a deliberate edit here.
          EDGE_KEYS = {"kind", "to", "confidence", "weight", "source"}

          root = pathlib.Path(sys.argv[1])
          pages = sorted(root.rglob("*.md"))
          if len(pages) < 10:
              sys.exit(f"only {len(pages)} page(s) under {root}; the build wrote nothing")

          failed = []
          for page in pages:
              text = page.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  failed.append((page, "no frontmatter fence"))
                  continue
              end = text.find("\n---\n", 3)
              if end < 0:
                  failed.append((page, "unterminated frontmatter fence"))
                  continue
              block = text[4:end + 1]
              try:
                  doc = yaml.safe_load(block)
              except yaml.YAMLError as err:
                  failed.append((page, str(err).replace("\n", " ")))
                  continue
              if not isinstance(doc, dict):
                  failed.append((page, f"frontmatter is {type(doc).__name__}, not a mapping"))
                  continue
              # The field issue #9 destroyed, checked by key set rather than by parseability.
              #
              # Parsing alone is not enough, and a comma proves it: an unquoted `[` raises,
              # but an unquoted `,` inside a flow mapping parses *clean* and silently splits
              # the scalar — `source: py/greeter/data,notes.py` reads back as
              # `source: py/greeter/data` plus an invented `notes.py: None` key. A check for
              # "did it parse" and even "does it have a kind" both pass on that. An
              # unexpected key does not, and it needs no advance knowledge of the character.
              for edge in doc.get("edges") or []:
                  if not isinstance(edge, dict):
                      failed.append((page, f"an edge read back as {edge!r}"))
                      continue
                  unknown = set(edge) - EDGE_KEYS
                  if unknown or "kind" not in edge:
                      failed.append((page, f"an edge read back with keys {sorted(edge)}, "
                                           f"which is a scalar that split: {edge!r}"))

          for page, why in failed:
              print(f"{page.relative_to(root)}: {why}")
          if failed:
              sys.exit(f"\n{len(failed)} page(s) emitted YAML a conforming reader cannot read")
          print(f"{len(pages)} page(s): frontmatter parses, every edge read back as a mapping")
          PY

      # The paths the corpus exists for, asserted by name. The parse check above would catch
      # an unquoted bracket, but it would not say which path caused it, and a future emitter
      # that dropped the hostile pages entirely would leave it green.
      - name: The hostile paths reached the bundle
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/corpus/.signpost"
          fail=0
          for p in 'app/tools/\[slug\]/page.tsx' 'app/blog/\[\.\.\.rest\]/page.tsx' 'greeter/data,notes.py'; do
            if ! grep -rq "$p" "$bundle"; then
              echo "no page mentions ${p}; the corpus fixture or the extractor changed"
              fail=1
            fi
          done
          exit "$fail"

      # A secret belongs to the service that reads it, not to every service in the file.
      #
      # A Facts is per file, and SecretRefs carried no service, so assemble attributed them
      # through the only link it had — the filename. Every service declared in a compose file
      # inherited every secret named anywhere in it, and on the repository where this surfaced
      # a reverse proxy with no `environment:` block was reported as reading nine credentials
      # including the database password. The corpus expresses the shape that produces it: one
      # compose file, two services, and a credential-shaped variable in exactly one of them.
      - name: Secrets are attributed to the service that reads them
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/corpus/.signpost"
          db="${bundle}/services/db.md"
          api="${bundle}/services/api.md"
          for p in "$db" "$api"; do
            [ -f "$p" ] || { echo "no page at ${p}; this step asserts nothing"; exit 1; }
          done

          # The counterpart that still fails: a fix that stopped reporting secrets at all
          # would satisfy the check below, and losing the fact is the other way to be wrong.
          grep -q 'POSTGRES_PASSWORD' "$db" || {
            echo "db declares POSTGRES_PASSWORD in compose.yaml and its page does not name it."
            echo "The reference was dropped rather than attributed."
            exit 1
          }

          if grep -q 'POSTGRES_PASSWORD' "$api"; then
            echo "the api service declares no credential-shaped variable, and its page names"
            echo "POSTGRES_PASSWORD — the secret belonging to db, the other service in the"
            echo "same compose file. That tells a reader a credential is reachable from a"
            echo "service that never sees it, which is worse than saying nothing."
            exit 1
          fi
          echo "secrets: attributed to db, not inherited by api"

      # A package this repository contains is not something this repository depends on.
      #
      # A monorepo declares its own packages as ordinary dependencies —
      # `"@scope/core": "workspace:*"` — and imports them by published name rather than by
      # relative path. With no name-to-directory map the resolver had nothing to match, so
      # every cross-package import fell through to the declared-dependency lookup and found
      # that entry, and first-party source was emitted as a third-party dependency page.
      # Measured on a real monorepo: 60 of 81 scoped externals were directories in the tree,
      # with 2064 edges pointing at them, and the module node for the package's own source
      # showed zero importers while its fabricated twin showed 122. Go was never affected,
      # because addGoModule always gave the resolver that map.
      - name: A workspace package is not an external dependency
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/corpus/.signpost"
          api=$(grep -rl 'title: ts/packages/api/src' "${bundle}/modules") || {
            echo "no module page for ts/packages/api/src; this step asserts nothing"; exit 1; }
          core=$(grep -rl 'title: ts/packages/core/src' "${bundle}/modules") || {
            echo "no module page for ts/packages/core/src; this step asserts nothing"; exit 1; }

          for p in corpus-core corpus-api; do
            if [ -f "${bundle}/references/npm-${p}.md" ]; then
              echo "references/npm-${p}.md is a page for a package that lives in this"
              echo "repository, presented as an external dependency. A reader auditing what"
              echo "this repo pulls in from outside is shown first-party source."
              exit 1
            fi
          done

          # The counterpart that still fails: dropping the import instead of resolving it
          # would satisfy the check above, and losing the cross-package coupling is the other
          # way to be wrong — in a monorepo it is the main structural fact there is.
          # `./` because both pages are under modules/ and edge targets are page-relative:
          # a sibling is `./name.md`, and the leading `/` this once asserted would now never
          # match. Kept as a literal rather than loosened to `to: .*$(basename …)` — the form
          # is part of what makes the bundle browsable on GitHub, so an assertion that stops
          # noticing a regression to the absolute form is not worth having.
          grep -qF "to: ./$(basename "$core")" "$api" || {
            echo "api imports @corpus/core by published name and there is no imports edge"
            echo "from $(basename "$api") to $(basename "$core"). The reference was dropped"
            echo "rather than resolved."
            exit 1
          }

          # And the guard against an over-broad exclusion: react is genuinely external and
          # must stay a reference page, or the fix traded false positives for false negatives.
          [ -f "${bundle}/references/npm-react.md" ] || {
            echo "npm-react.md is gone; react is a real third-party dependency and the"
            echo "workspace exclusion is matching more than the repository's own packages."
            exit 1
          }
          echo "workspace: @corpus/core resolved internally, react still external"

      # A Python package's absolute import resolves against the package, not the repository.
      #
      # The Python analogue of the tsconfig gap below, and the same class of defect.
      # `resolvePython` tried exactly two roots — the repository root and `src` — with a
      # comment claiming those cover essentially every Python project. True of a project,
      # false of a monorepo, which is where the imports are: 28 `pyproject.toml` files in one
      # measured repository, and `from api.client import make_api_request` written in 340
      # imports, each resolving against the package that declares it. Every one was reported
      # as a dependency nobody declares, while nine sibling packages each held their own
      # `api/client.py`.
      #
      # Two packages here hold that same module path deliberately, because the fix fails in
      # both directions: no per-package root leaves both unresolved, and a root governing the
      # whole repository sends both imports to whichever `api/client.py` sorts first — an edge
      # between two packages that cannot see each other, which is worse than the gap because
      # nothing in the bundle reports it as a guess.
      - name: A Python package resolves against its own root, not its sibling's
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/corpus/.signpost"
          alpha=$(grep -rl 'title: py/services/alpha$' "${bundle}/modules") || {
            echo "no module page for py/services/alpha; this step asserts nothing"; exit 1; }
          beta=$(grep -rl 'title: py/services/beta$' "${bundle}/modules") || {
            echo "no module page for py/services/beta; this step asserts nothing"; exit 1; }
          alpha_api=$(grep -rl 'title: py/services/alpha/api$' "${bundle}/modules") || {
            echo "no module page for py/services/alpha/api; this step asserts nothing"; exit 1; }
          beta_api=$(grep -rl 'title: py/services/beta/api$' "${bundle}/modules") || {
            echo "no module page for py/services/beta/api; this step asserts nothing"; exit 1; }

          fail=0
          # The positives: each package reaches its own code. Both pages are under modules/,
          # so an edge to a sibling is `./name.md`.
          grep -qF "to: ./$(basename "$alpha_api")" "$alpha" || {
            echo "no imports edge from py/services/alpha to its own api package."
            echo "\`from api.client import fetch\` is absolute and names a top-level package,"
            echo "so it resolves only against the directory holding that package's"
            echo "pyproject.toml. Neither the repository root nor src/ holds an api/ at all."
            fail=1
          }
          grep -qF "to: ./$(basename "$beta_api")" "$beta" || {
            echo "no imports edge from py/services/beta to its own api package."
            fail=1
          }
          # The negatives, and they are what a repo-wide root list fails. The specifier is
          # byte-identical in both handlers, so only the root's scope distinguishes them.
          if grep -qF "to: ./$(basename "$beta_api")" "$alpha"; then
            echo "py/services/alpha imports py/services/beta/api. These two packages each"
            echo "declare their own pyproject.toml and neither declares the other, so a"
            echo "resolution root governing the whole repository routed one package's"
            echo "\`api.client\` into the other's code — structure that does not exist,"
            echo "reported with the confidence of something extracted."
            fail=1
          fi
          if grep -qF "to: ./$(basename "$alpha_api")" "$beta"; then
            echo "py/services/beta imports py/services/alpha/api, same defect reversed."
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "python roots: each package resolved its own api/, neither reached the other's"

      # A codebase states what its own import specifiers mean, and nothing else states it.
      #
      # `compilerOptions.paths` is that statement: `@fider/services` is `public/services`
      # because one line of tsconfig.json says so. signpost did not read the file, so it
      # guessed at a few bare prefixes and reported every named alias as unresolved — 542 of
      # 3912 edges absent on the repository where this surfaced, 14% of the graph, from a
      # single unread mapping. Three shapes are asserted below, each a real one: an alias
      # inherited through `extends` (11 of 14 configs in one monorepo declare it and nothing
      # else), a pattern with two targets where the first does not exist, and an exact pattern
      # with no wildcard. The file is JSONC, which is not a curiosity — both real files that
      # declared `paths` carried comments, and a strict JSON parse of either fails outright.
      - name: A tsconfig path alias resolves to the directory it names
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/corpus/.signpost"
          # Found by title rather than by filename, because the filenames are positional —
          # ts/src is src-4.md only until another src/ directory sorts before it. The optional
          # quotes in the pattern are not optional to write: a title holding `[` is a YAML flow
          # indicator and is emitted quoted, which is issue #9's fix.
          page() {
            grep -rl "^title: \"\?$1\"\?\$" "${bundle}/modules" || {
              echo "no module page titled $1; this step asserts nothing" >&2; exit 1; }
          }
          api=$(page 'ts/packages/api/src')
          src=$(page 'ts/src')
          mkt=$(page 'ts/app/(marketing)')
          slug=$(page 'ts/app/tools/\[slug\]')

          # An alias prefix is a mapping onto this repository's own directories, never a
          # package. A reference page for one is a supply-chain entry nobody publishes.
          if ls "${bundle}/references/" | grep -qi 'npm-corpus-\(app\|ui\|entry\)\.md'; then
            echo "a tsconfig path alias was emitted as an external dependency page. The"
            echo "pattern matched and then fell through to the npm lookup, which fabricates a"
            echo "third-party package out of the codebase's own directory mapping."
            exit 1
          fi

          fail=0
          check() {
            grep -qF "kind: imports, to: ./$(basename "$2")" "$1" || {
              echo "no imports edge $(basename "$1" .md) -> $(basename "$2" .md): $3"; fail=1; }
          }
          check "$api" "$src" \
            "@corpus/app/greeter is declared two directories up, in ts/tsconfig.json, and the
             package's own config states only extends. The inheritance was not followed."
          check "$slug" "$mkt" \
            "@corpus/ui/* lists two targets and the first does not exist. Resolution stopped at
             the miss instead of trying the rest, which is the fallback TypeScript performs."
          check "$slug" "$src" \
            "@corpus/entry is an exact pattern with no wildcard. Only wildcards were matched."

          # The counterpart that still fails: every check above is satisfied by a resolver that
          # claims any bare specifier as internal until something matches, which is worse than
          # the bug. Asserted on the edge, not the page — a reference page exists for every
          # declared dependency whether or not an import ever reaches it.
          # `../references/` rather than `/references/`: the linking page is under modules/,
          # so a cross-directory target climbs one level. This is the assertion the relative
          # move was most likely to break silently — it is the negative boundary for the whole
          # step, and a pattern that can no longer match makes it fail for the wrong reason.
          grep -rqF 'to: ../references/npm-react' "${bundle}/modules" || {
            echo "nothing imports react any more. Alias matching is claiming specifiers it was"
            echo "given no mapping for and routing them into this repository, which hides what"
            echo "the code actually pulls in from outside."
            fail=1
          }
          [ "$fail" -eq 0 ] || exit 1
          echo "aliases: extends-inherited, two-target fallback, and exact pattern all resolved"

      # The negative boundary, and the only assertion in this job that fails in both directions.
      #
      # Every check above is a positive: this edge exists, that page does not. A positive is
      # satisfied by a resolver that is too generous exactly as well as by a correct one — claim
      # every specifier as internal and they all stay green while the map is wrong in the
      # direction nobody can see. Testing that 1+1 is 2 never catches an adder that answers 2
      # for everything.
      #
      # So the corpus carries a deliberate near-miss per language, each a name a slightly loose
      # matcher swallows: `example.com/corpus/greeterx/format` against the declared Go module
      # `example.com/corpus/greeter`; `@corpus/apples/juice` against the alias prefix
      # `@corpus/app/`, separated only by a slash; `httpx_extras` against the declared `httpx`,
      # in the spelling PEP 503 normalization rewrites; `serde_yaml::Value` against the declared
      # `serde`, in the spelling Cargo's dash/underscore equivalence accepts; `winreg_helpers`
      # against the stdlib `winreg`, which is the boundary on the other side of the completed
      # pyStdlib list — a longer table is a wider surface for a prefix match, and a package
      # silently reclassified as the runtime is exactly the gap this count exists to surface.
      # Each must be reported as a gap and land nowhere else — an edge inside this repository
      # invents structure, an external node invents a supply-chain entry nobody declared.
      #
      # The count carries the assertion because the printed list is truncated to the five most
      # frequent, so a grep for any single specifier passes by matching `and 1 more`. Verified
      # by mutation: comparing a Go module prefix by string rather than by path segment, and
      # comparing an alias prefix without its trailing slash, each drop the count while leaving
      # the node and edge totals untouched at 25 and 24.
      - name: Resolution reports exactly the gaps it should
        run: |
          set -euo pipefail
          corpus="${RUNNER_TEMP}/corpus"
          bundle="${corpus}/.signpost"
          # Its own build, capturing stderr: the coverage report goes there, and the tee above
          # captures only stdout.
          ./signpost build -repo example.com/corpus "$corpus" 2>"${RUNNER_TEMP}/gaps.txt" >/dev/null
          got=$(sed -n 's/^ *[0-9]* import(s) unresolved across \([0-9]*\) specifier(s).*/\1/p' \
            "${RUNNER_TEMP}/gaps.txt" | head -1)
          [ -n "$got" ] || {
            echo "no unresolved line in the coverage report. Every near-miss in the corpus"
            echo "resolved to something, so resolution is claiming names nothing declares."
            cat "${RUNNER_TEMP}/gaps.txt"
            exit 1
          }
          want=7
          [ "$got" = "$want" ] || {
            echo "${got} unresolved specifier(s), want ${want}."
            echo
            echo "Higher means something that resolves is being reported as a gap. Lower means a"
            echo "near-miss was claimed: routed into this repository as an edge it should not"
            echo "have, or folded into a declared dependency it is not, which reports a package"
            echo "this code does not use."
            cat "${RUNNER_TEMP}/gaps.txt"
            exit 1
          }
          # And no page for any of them. Which wrong home an over-match picks depends on the
          # repository, so the count above is the primary assertion and this is the corroborating
          # one: a near-miss folded into a declared dependency shows up here as nothing at all,
          # while one fabricated outright shows up as a file.
          for frag in apples greeterx httpx-extras httpx_extras serde-yaml serde_yaml pathe \
                      promises winreg-helpers winreg_helpers; do
            if ls "${bundle}/references/" | grep -qi "$frag"; then
              echo "a reference page exists for ${frag}, which no manifest in the corpus declares."
              exit 1
            fi
          done
          # The platform-specific stdlib, matched on the whole filename rather than as a
          # fragment: `winreg_helpers` above is a deliberate near-miss, and a fragment check
          # for `winreg` would be satisfied by the very page that must not exist. These two are
          # why pyStdlib is generated from sys.stdlib_module_names rather than kept by hand —
          # `winreg` is Windows-only and `fcntl` Unix-only, so a hand-kept list omits exactly
          # what the other platform's code imports, and portable code produced the most gaps.
          for name in winreg fcntl; do
            if [ -f "${bundle}/references/pypi-${name}.md" ]; then
              echo "references/pypi-${name}.md is a page for platform-specific standard"
              echo "library. Nobody publishes or patches it, so a reference page for it is a"
              echo "supply-chain entry for the interpreter itself."
              exit 1
            fi
          done
          echo "gaps: ${got} specifier(s), each a deliberate near-miss, none fabricated"

      # The same shape of assertion for the other kind of gap: a file whose *kind* signpost
      # could not determine, as against a language it recognises and has no extractor for.
      #
      # `ClassOther` is what discovery assigns to the second case. Every other class routes to
      # an extractor or a manifest reader, and the two that can come back empty-handed report it
      # — extract.RunResult and manifest.RunResult each carry an Unhandled map this report
      # prints. ClassOther had no counterpart: written in one place, read in none. On a
      # repository whose entire landing page was two .astro files, the report named `.sh` and
      # `.sql` — both in sourceExts as LangOther, so extraction counts them — and said nothing
      # about the pages, while the bundle called that workspace a one-file JavaScript module
      # built from astro.config.mjs. Whether the extension was in sourceExts decided whether the
      # gap was visible at all, and every extractor still to be written adds one.
      #
      # Reusing the capture from the step above: same build, same repository, and the coverage
      # report is written once.
      - name: Unclassified files are counted, not swallowed
        run: |
          set -euo pipefail
          gaps="${RUNNER_TEMP}/gaps.txt"
          got=$(sed -n 's/^ *\([0-9]*\) file(s) of no recognised kind:.*/\1/p' "$gaps" | head -1)
          [ -n "$got" ] || {
            echo "no unclassified line in the coverage report. testdata/corpus holds two .astro"
            echo "files, an .svg, and a LICENSE, none of which is a recognised kind, so silence"
            echo "here means discovery is claiming to have accounted for files nothing read."
            cat "$gaps"
            exit 1
          }
          # Two .astro rather than one, so the count cannot be satisfied by an implementation
          # that reports an extension once however many files carry it.
          want=4
          [ "$got" = "$want" ] || {
            echo "${got} file(s) of no recognised kind, want ${want}."
            echo
            echo "Higher means a classified file is being reported as unread — a README, a"
            echo "manifest, or a binary, any of which makes this line fire on every repository"
            echo "and teaches people to skip the one place coverage gaps are admitted. Lower"
            echo "means a genuinely unread file stopped being counted."
            cat "$gaps"
            exit 1
          }
          line=$(sed -n 's/^ *[0-9]* file(s) of no recognised kind: //p' "$gaps" | head -1)
          for frag in '.astro (2)' '.svg (1)' 'license (1)'; do
            case "$line" in
              *"$frag"*) ;;
              *) echo "the unclassified line does not name ${frag}: ${line}"; exit 1 ;;
            esac
          done
          # The negative half. Each of these is classified, routed, and read; `web/README.md`
          # sits in the same directory as the two .astro files precisely so an implementation
          # counting by directory fails here. And it stays a separate line from the languages
          # with no extractor — folding them loses the difference between "cannot read this
          # language" and "cannot tell what this file is".
          for frag in .md .go .ts .py .rs .toml .json .yaml .png codeowners; do
            case "$line" in
              *"$frag"*) echo "${frag} is on the unclassified line, but the corpus reads it: ${line}"; exit 1 ;;
            esac
          done
          echo "unclassified: ${got} file(s), each genuinely unread, no classified file among them"

      # -include-vendored, which spent v0.1.0 doing nothing (issue #11). The walk honoured
      # the flag and read the files; every consumer downstream filtered them back out on
      # File.Vendored with no reference to the option, so the flag read vendored code off
      # disk and threw it away.
      #
      # Here rather than in Go alone because nothing in signpost's own tree is vendored, and
      # a bug that survives a package's unit tests survives because the tree those tests run
      # in cannot express the condition. `testdata/corpus/ts/node_modules/` can: a committed
      # node_modules is a real pattern .gitignore does not exclude.
      #
      # Two assertions because the two halves fail independently, measured rather than
      # assumed: reverting `Sources()` alone leaves the module page missing and the citation
      # check untouched, and reverting manifest.Registry.Run alone does the reverse. So a fix
      # to extraction alone analyses the vendored source and still discards the package.json
      # beside it, leaving a module whose own declaration signpost read and dropped.
      # `vendored-only-tinycolor` is declared nowhere else in the corpus, so it can reach a
      # bundle only through the vendored manifest.
      #
      # Its own copy of the tree: this build writes a bundle, and the CRLF stage below
      # measures the default one.
      - name: The include-vendored flag reaches the bundle, not only the walk
        run: |
          set -euo pipefail
          corpus="${RUNNER_TEMP}/corpus-vendored"
          cp -r testdata/corpus "$corpus"
          git -C "$corpus" init --quiet --initial-branch=main
          git -C "$corpus" config user.name "Corpus Author"
          git -C "$corpus" config user.email "corpus@example.invalid"
          git -C "$corpus" add -A
          GIT_AUTHOR_DATE=2026-01-01T00:00:00Z GIT_COMMITTER_DATE=2026-01-01T00:00:00Z \
            git -C "$corpus" commit --quiet -m "the corpus"

          # The negative boundary first. Without the flag the walk prunes the directory, so
          # neither the vendored module nor the dependency it alone declares may appear
          # anywhere in the bundle.
          ./signpost build -repo example.com/corpus "$corpus" >/dev/null 2>&1
          for frag in corpus-vendor vendored-only-tinycolor; do
            if grep -rqi "$frag" "${corpus}/.signpost"; then
              echo "the default bundle names ${frag}, which lives under node_modules/."
              echo "Vendored code is another repository's content and is off the map unless"
              echo "asked for; a default run that describes it is describing someone else's"
              echo "repository as this one."
              grep -rli "$frag" "${corpus}/.signpost"
              exit 1
            fi
          done
          if [ -f "${corpus}/.signpost/modules/logger.md" ]; then
            echo "a module page for the vendored logger exists in a default build"; exit 1
          fi
          echo "default: vendored code absent from the bundle"

          # And the positive. Both halves are named, because either one alone passing is the
          # bug half-fixed.
          rm -rf "${corpus}/.signpost"
          ./signpost build -include-vendored -repo example.com/corpus "$corpus" >/dev/null 2>&1
          [ -f "${corpus}/.signpost/modules/logger.md" ] || {
            echo "no module page for the vendored logger with -include-vendored. The walk read"
            echo "the directory and Sources() excluded it, so the extractors never saw code"
            echo "signpost had already read off disk — issue #11."
            ls "${corpus}/.signpost/modules/"
            exit 1
          }
          grep -rqi vendored-only-tinycolor "${corpus}/.signpost" || {
            echo "nothing in the bundle cites vendored-only-tinycolor, which only the vendored"
            echo "manifest declares. The flag read the file and no consumer looked at it."
            exit 1
          }
          echo "with the flag: the vendored module and its own dependency both reached the bundle"

      # The bundle is signpost's own output, and a run that walks it describes itself.
      #
      # Not caught by .gitignore, because the bundle is committed on purpose (ADR 0005) —
      # which is how this shipped. The graph was never wrong, so a nodes-and-edges assertion
      # stays green through the whole defect; what moved is the census, the one number a user
      # has for judging whether the map covers their repository, and it moved *upward* every
      # time the bundle grew. Two runs are the whole mechanism, so this must come before the
      # CRLF stage below, while a second build of an unchanged tree is still meaningful.
      - name: A second build does not analyse the bundle it just wrote
        run: |
          set -euo pipefail
          # A copy with no bundle in it, because the step above already built one. Measuring
          # the second and third builds of an already-bundled tree gives two equally inflated
          # numbers and a green step — the exact false negative this check is about.
          corpus="${RUNNER_TEMP}/corpus-census"
          cp -r testdata/corpus "$corpus"
          git -C "$corpus" init --quiet --initial-branch=main
          git -C "$corpus" config user.name "Corpus Author"
          git -C "$corpus" config user.email "corpus@example.invalid"
          git -C "$corpus" add -A
          GIT_AUTHOR_DATE=2026-01-01T00:00:00Z GIT_COMMITTER_DATE=2026-01-01T00:00:00Z \
            git -C "$corpus" commit --quiet -m "the corpus"

          ./signpost build -repo example.com/corpus "$corpus" 2>"${RUNNER_TEMP}/cov1.txt" >/dev/null
          ./signpost build -repo example.com/corpus "$corpus" 2>"${RUNNER_TEMP}/cov2.txt" >/dev/null
          count() { sed -n 's/^analysed \([0-9]*\) files:.*/\1/p' "$1" | head -1; }
          a=$(count "${RUNNER_TEMP}/cov1.txt"); b=$(count "${RUNNER_TEMP}/cov2.txt")
          [ -n "$a" ] && [ -n "$b" ] || { echo "no coverage report found; this step asserts nothing"; exit 1; }
          echo "census: ${a} then ${b}"
          [ "$a" = "$b" ] || {
            echo "the file census moved between two builds of an unchanged tree. A run that"
            echo "walks the pages the last run wrote is reporting its own output as"
            echo "repository content, and the number grows with every build."
            exit 1
          }

      # The CRLF regression, on the runner that can least afford to assume it away. This job
      # runs on Linux, where no checkout produces CRLF — which is the point: the conversion is
      # applied by hand, so the assertion does not depend on the runner's git config, and the
      # gate holds identically on all three platforms in the test job.
      #
      # Worth having here and in Go, because these check different claims. `go test` asserts
      # the counts the build reports; this asserts that a bundle whose bytes a checkout
      # rewrote is still accepted by the *shipped binary*, and it is the last stage before a
      # release that would tell a Windows user their bundle is stale on the day they clone it.
      - name: A CRLF checkout of the bundle is up to date, not stale
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/corpus/.signpost"
          n=0
          while IFS= read -r -d '' f; do
            # Normalised first, so a file already carrying CRLF does not become CR CR LF.
            perl -pi -e 's/\r\n/\n/g; s/\n/\r\n/g' "$f"
            n=$((n + 1))
          done < <(find "$bundle" -type f \( -name '*.md' -o -name '*.json' \) -print0)
          [ "$n" -gt 0 ] || { echo "no bundle file was converted; this step asserts nothing"; exit 1; }
          echo "converted ${n} file(s) to CRLF"

          ok=0
          ./signpost verify -quiet -repo example.com/corpus "${RUNNER_TEMP}/corpus" \
            >"${RUNNER_TEMP}/verify-crlf.txt" || ok=$?
          cat "${RUNNER_TEMP}/verify-crlf.txt"
          [ "$ok" -eq 0 ] || {
            echo "verify called a CRLF checkout stale. The bundle is byte-identical to what a"
            echo "build produces once line endings are read as the transport encoding they are,"
            echo "and the remedy the message names cannot fix it — a rebuild writes LF and the"
            echo "next checkout converts it back."
            exit 1
          }

          ./signpost build -repo example.com/corpus "${RUNNER_TEMP}/corpus" \
            | tee "${RUNNER_TEMP}/build-crlf.txt"
          grep -q '0 created, 0 updated' "${RUNNER_TEMP}/build-crlf.txt" || {
            echo "build rewrote a CRLF checkout that was already correct"; exit 1; }
          if grep -q 'had human notes' "${RUNNER_TEMP}/build-crlf.txt"; then
            echo "build claimed human notes on a bundle with no human edits. That count exists"
            echo "to tell a user their writing was kept, so inventing it teaches them the"
            echo "number means nothing."
            exit 1
          fi

          # Real drift in a managed region must still fail, or the check above is satisfied by
          # a fix that stopped checking.
          perl -0pi -e 's/(<!-- signpost:managed:[a-z0-9_-]+ -->\r\n)/$1Not what the graph says.\r\n/' \
            "${bundle}/index.md"
          drift=0
          ./signpost verify -quiet -repo example.com/corpus "${RUNNER_TEMP}/corpus" \
            >"${RUNNER_TEMP}/verify-drift.txt" 2>&1 || drift=$?
          cat "${RUNNER_TEMP}/verify-drift.txt"
          [ "$drift" -ne 0 ] || {
            echo "verify passed on a CRLF checkout whose managed region had been edited."
            echo "Normalising line endings must not normalise away a change in what the"
            echo "bundle says."
            exit 1
          }
          echo "CRLF: up to date when correct, still failing on real drift"

      # The empty-manifest false positive, found by reading signpost's own practices page:
      # "The Go dependencies are declared but not pinned by any lockfile in the tree, so two
      # builds can resolve different versions" — against a go.mod with an empty require block
      # and no go.sum. Nothing was declared, so nothing resolves and two builds cannot differ.
      #
      # A second copy of the corpus, because this step empties a dependency table and deletes a
      # lockfile: the steps above assert on Cargo resolution and would fail for a reason that is
      # not a bug. The condition cannot be expressed by the corpus as committed — all four of
      # its ecosystems declare dependencies, deliberately, since the resolution assertions need
      # them to.
      - name: A manifest with nothing to pin says so, and an unpinned one still fails
        run: |
          set -euo pipefail
          corpus="${RUNNER_TEMP}/corpus-nodeps"
          cp -r testdata/corpus "$corpus"
          git -C "$corpus" init --quiet --initial-branch=main
          git -C "$corpus" config user.name "Corpus Author"
          git -C "$corpus" config user.email "corpus@example.invalid"

          # A crate declaring a package and no dependencies: legal, common in a workspace
          # member, and the shape of the empty require block. The lockfile goes with it, since a
          # manifest with nothing to pin and a lockfile beside it reports as pinned instead.
          cat >"${corpus}/rust/Cargo.toml" <<'TOML'
          [package]
          name = "corpus-greeter"
          version = "0.1.0"
          edition = "2021"
          TOML
          rm "${corpus}/rust/Cargo.lock"
          git -C "$corpus" add -A
          GIT_AUTHOR_DATE=2026-01-01T00:00:00Z GIT_COMMITTER_DATE=2026-01-01T00:00:00Z \
            git -C "$corpus" commit --quiet -m "the corpus, with an empty dependency table"

          ./signpost build -quiet -repo example.com/corpus "$corpus"
          page="${corpus}/.signpost/practices.md"
          [ -f "$page" ] || { echo "no practices page was written"; exit 1; }

          grep -qF 'The Cargo manifest declares no dependencies' "$page" || {
            echo "the page does not state that the Cargo manifest declares nothing. Its"
            echo "dependency table is empty and no Cargo.lock is in the tree."
            exit 1
          }
          if grep -qF 'The Cargo dependencies are declared but not pinned' "$page"; then
            echo "the page reports an empty dependency table as unpinned, so it tells a reader"
            echo "two builds can resolve different versions of nothing."
            exit 1
          fi

          # The counterparts, from the same build. Without them the check above is satisfied by
          # a page that stopped reporting unpinned ecosystems at all — the more expensive bug,
          # because an unreproducible build then reads as a clean one.
          grep -qF 'The Python dependencies are declared but not pinned' "$page" || {
            echo "the page stopped reporting the unpinned Python manifest, which declares two"
            echo "dependencies and has no lockfile beside it."
            exit 1
          }
          grep -qF 'The Go dependencies are pinned by a lockfile' "$page" || {
            echo "the page stopped reporting the pinned Go module"; exit 1; }

          # One empty manifest in this tree. A count, because a branch that fell through would
          # state it for Python as well and every check above would still pass.
          n=$(grep -cF 'manifest declares no dependencies' "$page")
          [ "$n" -eq 1 ] || {
            echo "${n} manifest(s) reported as declaring nothing, want 1 — only the crate's"
            echo "table was emptied."
            exit 1
          }
          echo "dependencies: nothing-to-pin stated, unpinned still reported"

      # Telemetry, against a collector that is not signpost's own httptest.Server (ADR 0014).
      #
      # `go test ./cmd/signpost -run TestCorpusTelemetry` covers the same properties in-process
      # on all three platforms. This step is what that cannot do: the payload is read by a
      # parser with no stake in signpost being right, from a real subprocess whose environment
      # is the one an operator sets, over a real socket. An exporter that encoded a timestamp as
      # a JSON number, or a batch that never left because the flush raced the exit, looks
      # identical from inside the process that wrote it.
      #
      # Both boundaries. Positive: every stage span arrives, so the content check below cannot
      # be satisfied by an exporter that sends nothing. Negative: nothing the corpus contains
      # is anywhere in the bytes — and the corpus is the tree that can violate that, holding
      # `[slug]` paths, a comma in a filename, internal package names, and a secret's name.
      - name: Spans reach a collector, and carry nothing from the repository
        run: |
          set -euo pipefail
          corpus="${RUNNER_TEMP}/corpus-telemetry"
          cp -r testdata/corpus "$corpus"
          git -C "$corpus" init --quiet --initial-branch=main
          git -C "$corpus" config user.name "Corpus Author"
          git -C "$corpus" config user.email "corpus@example.invalid"
          git -C "$corpus" add -A
          GIT_AUTHOR_DATE=2026-01-01T00:00:00Z GIT_COMMITTER_DATE=2026-01-01T00:00:00Z \
            git -C "$corpus" commit --quiet -m "the corpus"

          # A collector in ~25 lines of stdlib, reused by the step after this one. Each body
          # is appended as one tab-separated line, which is what makes the assertions below a
          # read of a file rather than a parse of a log.
          #
          # A GET is the readiness probe: answering it needs no request body and cannot be
          # mistaken for an export, so nothing has to be truncated afterwards — and truncating
          # is not available anyway, since this process holds the file open at its own offset
          # and a `: >file` from the shell would leave the gap reading back as NUL bytes.
          cat >"${RUNNER_TEMP}/collector.py" <<'PY'
          import http.server, sys

          out = open(sys.argv[2], "w", encoding="utf-8")

          class H(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def do_POST(self):
                  n = int(self.headers.get("Content-Length", 0))
                  body = self.rfile.read(n).decode("utf-8")
                  out.write(self.headers.get("Content-Type", "") + "\t" + body + "\n")
                  out.flush()
                  self.send_response(200)
                  self.send_header("Content-Length", "0")
                  self.end_headers()

              def do_GET(self):
                  self.send_response(204)
                  self.send_header("Content-Length", "0")
                  self.end_headers()

              def log_message(self, *a):
                  pass

          http.server.HTTPServer(("127.0.0.1", int(sys.argv[1])), H).serve_forever()
          PY
          batches="${RUNNER_TEMP}/batches.tsv"
          python3 "${RUNNER_TEMP}/collector.py" 14318 "$batches" &
          collector=$!
          # shellcheck disable=SC2064
          trap "kill ${collector} 2>/dev/null || true" EXIT
          for _ in $(seq 1 50); do
            curl -sf -o /dev/null http://127.0.0.1:14318/ready && break
            sleep 0.2
          done
          curl -sf -o /dev/null http://127.0.0.1:14318/ready || {
            echo "the collector never came up, so this step would assert nothing"; exit 1
          }

          # 14318, not the default 4318, and the endpoint is named rather than defaulted. A
          # self-hosted runner can have its own collector on the default port, and then this
          # step posts a repository's spans to a listener it does not own — the negative
          # assertion below would still pass, having checked a file nothing wrote to. The
          # default's own resolution is covered by TestEndpointResolution, which needs no
          # socket to check it.
          #
          # OTEL_RESOURCE_ATTRIBUTES and OTEL_SERVICE_NAME are cleared because they override
          # signpost's own resource by design, so a runner image exporting either would fail
          # the resource allowlist below for a reason that is not a defect in signpost.
          SIGNPOST_ENABLE_TELEMETRY=1 \
          OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:14318 \
          OTEL_RESOURCE_ATTRIBUTES='' OTEL_SERVICE_NAME='' \
            ./signpost build -quiet -repo example.com/corpus "$corpus" \
            2>"${RUNNER_TEMP}/telemetry-stderr.txt"
          cat "${RUNNER_TEMP}/telemetry-stderr.txt"
          if grep -qF 'telemetry:' "${RUNNER_TEMP}/telemetry-stderr.txt"; then
            echo "the build reported a telemetry fault against a collector answering 200"
            exit 1
          fi
          [ -s "$batches" ] || {
            echo "the collector received nothing, so this step asserts nothing about what a"
            echo "real repository's spans contain. Either the exporter never posted or the"
            echo "flush did not finish before the process exited."
            exit 1
          }
          # Kept for the next step, which compares it against a bundle built with telemetry
          # off. Outside the corpus, so it is not content the next run discovers.
          cp -r "$corpus/.signpost" "${RUNNER_TEMP}/bundle-exported"

          python3 - "$batches" <<'PY'
          import json, pathlib, sys

          # Every stage analyse() runs. A missing one means the trace cannot answer which
          # stage was slow, which is the whole question the instrumentation exists for.
          WANT_SPANS = {"analyse", "discover", "extract", "manifests", "history", "assemble"}

          # Each is a category the corpus supplies, not a sample: a path, a path holding a YAML
          # indicator, a comma in a filename, internal package names, a declared dependency, a
          # module path, and the name of a secret. A repository's contents leave the machine
          # only through the semantic pass, which is opt-in (ADR 0009).
          FORBIDDEN = ["page.tsx", "[slug]", "data,notes", "greeter", "codec", "corpus",
                       "POSTGRES_PASSWORD", "example.com", "go.mod", "Cargo.toml",
                       "pyproject", "compose", "node_modules"]

          # The resource is attached to every span in the batch, so a detector added later that
          # reads a filesystem path leaks everywhere at once. Fixed list, deliberately.
          ALLOWED_RESOURCE = {"service.name", "service.version", "telemetry.sdk.name",
                              "telemetry.sdk.language", "telemetry.sdk.version"}

          raw = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          fail, seen = [], set()
          batches = 0

          for line in raw.splitlines():
              if not line.strip():
                  continue
              ctype, _, body = line.partition("\t")
              batches += 1
              # OTLP over HTTP defaults to protobuf, so this header is what tells a collector
              # which parser to use. Wrong and every batch is rejected as a malformed protobuf.
              if ctype != "application/json":
                  fail.append(f"Content-Type is {ctype!r}, want application/json")
              # The independent parse. signpost's own encoder produced these bytes, so a test
              # using it would pass on whatever it emitted.
              try:
                  payload = json.loads(body)
              except json.JSONDecodeError as e:
                  fail.append(f"batch {batches} is not valid JSON: {e}")
                  continue
              for frag in FORBIDDEN:
                  if frag in body:
                      fail.append(f"{frag!r} from the corpus reached the collector")
              for rs in payload.get("resourceSpans", []):
                  for a in rs.get("resource", {}).get("attributes", []):
                      if a["key"] not in ALLOWED_RESOURCE:
                          fail.append(f"resource attribute {a['key']!r} is not one signpost "
                                      f"sets; it is attached to every span in the batch")
                  for ss in rs.get("scopeSpans", []):
                      for s in ss.get("spans", []):
                          seen.add(s["name"])
                          # 64-bit integers are proto3-JSON strings. A number here is read
                          # back as a float64, so a nanosecond timestamp loses its low digits
                          # and the span acquires a duration it did not have.
                          for k in ("startTimeUnixNano", "endTimeUnixNano"):
                              if not isinstance(s.get(k), str):
                                  fail.append(f"{s['name']}.{k} is {type(s.get(k)).__name__}, "
                                              f"want a JSON string")
                          # Lowercase hex, an explicit OTLP exception to proto3's
                          # base64-for-bytes rule.
                          for k, width in (("traceId", 32), ("spanId", 16)):
                              v = s.get(k, "")
                              if len(v) != width or v != v.lower() or v.strip("0123456789abcdef"):
                                  fail.append(f"{s['name']}.{k} is {v!r}, want {width} "
                                              f"lowercase hex chars")
                          for a in s.get("attributes", []):
                              if not a["key"].startswith("signpost."):
                                  fail.append(f"{s['name']} carries {a['key']!r}, outside "
                                              f"signpost's namespace")
                              # A path reaches a span as a string attribute, and no method on
                              # telemetry.Span can produce one. This is the check a later
                              # change adding a string setter fails.
                              if "intValue" not in a["value"]:
                                  fail.append(f"{s['name']} carries {a['key']}={a['value']}, "
                                              f"which is not a count")

          missing = WANT_SPANS - seen
          if missing:
              fail.append(f"no span named {sorted(missing)} arrived, so the checks above are "
                          f"satisfied by an exporter that sent almost nothing")
          if fail:
              for f in sorted(set(fail)):
                  print(f"  {f}")
              sys.exit(f"{len(set(fail))} telemetry finding(s) across {batches} batch(es)")
          print(f"telemetry: {batches} batch(es), {len(seen)} span name(s), "
                f"no repository content")
          PY

      # The default, and the promise that telemetry can never be why a build failed.
      #
      # An OTEL_* endpoint in the environment is not consent — CI runners carry them for
      # unrelated collectors, and ADR 0009's rule is that a default which sends anything
      # anywhere has already sent it by the time anyone notices. So: endpoint set, gate unset,
      # and the collector must see nothing. Then the gate set against a port nothing is
      # listening on, which is the common CI shape, and the build must still exit 0.
      #
      # Every bundle here is compared against a baseline built with telemetry off, not handed
      # to `verify`. A `verify` straight after a `build` passes on whatever that build wrote,
      # so it cannot see a span that leaked into a page or an exporter goroutine that
      # perturbed a map iteration — the two ways instrumentation changes output it is only
      # supposed to measure. `diff -r` can.
      - name: An endpoint alone sends nothing, and an unreachable one fails open
        run: |
          set -euo pipefail
          corpus="${RUNNER_TEMP}/corpus-telemetry"
          batches="${RUNNER_TEMP}/batches-off.tsv"
          python3 "${RUNNER_TEMP}/collector.py" 14319 "$batches" &
          collector=$!
          # shellcheck disable=SC2064
          trap "kill ${collector} 2>/dev/null || true" EXIT
          for _ in $(seq 1 50); do
            curl -sf -o /dev/null http://127.0.0.1:14319/ready && break
            sleep 0.2
          done
          curl -sf -o /dev/null http://127.0.0.1:14319/ready || {
            echo "the collector never came up, so the off-by-default assertion below would"
            echo "pass against a port nothing was listening on"; exit 1
          }

          # The baseline: no telemetry variables at all, and outside the corpus so the copy
          # is not content the next run discovers.
          ./signpost build -quiet -repo example.com/corpus "$corpus" >/dev/null
          cp -r "$corpus/.signpost" "${RUNNER_TEMP}/bundle-baseline"

          OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:14319 \
            ./signpost build -quiet -repo example.com/corpus "$corpus" \
            2>"${RUNNER_TEMP}/off-stderr.txt"
          if [ -s "$batches" ]; then
            echo "a batch was posted with SIGNPOST_ENABLE_TELEMETRY unset. An OTEL_* endpoint"
            echo "in the environment is never sufficient on its own — CI runners carry them"
            echo "for unrelated collectors (ADR 0009, ADR 0014 clause 3)."
            cat "$batches"
            exit 1
          fi
          if grep -qF 'telemetry:' "${RUNNER_TEMP}/off-stderr.txt"; then
            echo "a run with telemetry off mentioned it on stderr"; exit 1
          fi
          diff -r "${RUNNER_TEMP}/bundle-baseline" "$corpus/.signpost" || {
            echo "the bundle changed on a run with telemetry off"; exit 1
          }
          echo "off by default: endpoint set, nothing sent, bundle unchanged"

          # Port 14999: nothing is bound, so the connection is refused. The failure has to be
          # reported — the absence of a measurement never reads as a clean bill of health —
          # and it has to change nothing else.
          code=0
          SIGNPOST_ENABLE_TELEMETRY=1 OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:14999 \
            ./signpost build -quiet -repo example.com/corpus "$corpus" \
            2>"${RUNNER_TEMP}/dead-stderr.txt" || code=$?
          cat "${RUNNER_TEMP}/dead-stderr.txt"
          [ "$code" -eq 0 ] || {
            echo "an unreachable collector changed the exit code to ${code}. Telemetry can"
            echo "never be the reason a build failed (ADR 0014 clause 4)."
            exit 1
          }
          grep -qF 'telemetry:' "${RUNNER_TEMP}/dead-stderr.txt" || {
            echo "an unreachable collector was not reported at all, so a user who asked for"
            echo "telemetry gets silence indistinguishable from a working exporter."
            exit 1
          }
          diff -r "${RUNNER_TEMP}/bundle-baseline" "$corpus/.signpost" || {
            echo "the bundle differs from the telemetry-off baseline after a run whose"
            echo "exporter could not reach anything, so instrumentation changed the output"
            echo "it is only supposed to measure."
            exit 1
          }
          echo "fail open: unreachable collector reported, exit 0, bundle unchanged"

          # And the same comparison for the run that did export, in the step above. That one
          # posted six span batches through a live socket, which is the configuration most
          # likely to perturb timing — so it is the one whose output matters most here.
          diff -r "${RUNNER_TEMP}/bundle-baseline" "${RUNNER_TEMP}/bundle-exported" || {
            echo "the bundle from the exporting run differs from the telemetry-off baseline"
            exit 1
          }
          echo "exporting run: bundle identical to the telemetry-off baseline"

  security:
    name: security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history, which needs all of it. A secret removed from the
          # tip but still reachable in an earlier commit is still leaked.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -quiet ./...

      - name: gitleaks
        run: |
          version=8.30.1
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --verbose

  dependencies:
    name: dependency gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate compares this branch's direct dependencies against the base, so
          # it needs the base commit.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Tidy is committed
        # A go.mod or go.sum that differs from what `go mod tidy` produces means the
        # dependency list in the repository is not the one the build actually uses,
        # which makes every statement below it unverifiable.
        #
        # Compared through git rather than by copying files aside: signpost has no
        # go.sum today, and a `[ -f go.sum ]` test under `set -e` would fail the step
        # on the absence rather than skip the check.
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result"
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: A new direct dependency requires an ADR
        # §8: this gate is the mechanism that keeps the dependency list short enough
        # for bumping to stay routine. Without it, "few dependencies, each justified"
        # decays within a quarter — every individual addition looks reasonable, and
        # nobody is reviewing the total.
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Direct requirements only. `// indirect` marks the transitive set, which
          # arrives as a consequence of a direct choice and is not itself one. The
          # marker is a comment, which is exactly what distinguishes the two, so the
          # require block is read directly rather than through `go mod edit -json` —
          # that would need the base go.mod checked out as a module directory.
          requires() {
            awk '/^require \(/ {block=1; next}
                 /^\)/          {block=0}
                 block && NF && !/\/\/ indirect/ {print $1}
                 /^require [^(]/ && !/\/\/ indirect/ {print $2}' "$1" | sort -u
          }

          # An empty file when the base has no go.mod at all, so a first-commit case
          # reports every requirement as new rather than failing on a missing object.
          git show "${BASE}:go.mod" > /tmp/base.mod 2>/dev/null || : > /tmp/base.mod
          requires /tmp/base.mod > /tmp/base.direct
          requires go.mod > /tmp/head.direct

          added="$(comm -13 /tmp/base.direct /tmp/head.direct)"
          if [ -z "$added" ]; then
            echo "no new direct dependencies"
            exit 0
          fi

          echo "new direct dependencies in this pull request:"
          echo "$added"

          # An ADR must be added or modified in the same pull request. Requiring it
          # here rather than in review is the point: a reviewer looking at one
          # plausible dependency has no view of the total, and the ADR is where the
          # justification becomes reviewable later.
          if git diff --name-only "${BASE}...HEAD" | grep -q '^docs/adr/.*\.md$'; then
            echo "an ADR accompanies this change"
            exit 0
          fi
          echo
          echo "A new direct dependency needs an ADR in docs/adr/ (see CONTRIBUTING.md)."
          echo "State what the dependency buys and what the stdlib alternative costs."
          exit 1
