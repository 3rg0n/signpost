name: release

# Tag-triggered. Cross-compiles every supported platform from one runner, which Go
# does natively, and publishes archives plus a checksums file the installers verify
# against. A matrix of real runners would buy nothing here and would produce
# archives built on three different images.
on:
  push:
    tags:
      - "v*"
  # A recovery path, not a second way to release. A tag push is suppressed when the
  # tagged commit's message carries [skip ci]: GitHub honours the keyword on a tag
  # push too, and this repository pushes a bundle rebuild carrying it after every
  # merge (ADR 0005) — which is the commit at the tip of main when a release is cut.
  # pages.yml records the same hazard for the same reason.
  #
  # v0.2.0 was tagged there. It published nothing and reported nothing, because a
  # suppressed workflow leaves no run to look at, failed or otherwise. Tag the merge
  # commit instead. When a tag is already on a rebuild commit, dispatch this workflow
  # with that tag as the ref, rather than moving the tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-24.04
    permissions:
      # Creating the release and uploading assets to it.
      contents: write
    steps:
      # First, before a checkout and before the gate. A push can only arrive here from a
      # v* tag, but a dispatch takes whatever ref it is given and the Actions UI offers
      # branches first. A mis-selected ref would otherwise run the whole gate and then
      # fail in `gh release create --verify-tag`, ten minutes later, looking for a tag
      # named after a branch.
      - name: Check the ref is a release tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != tag ]; then
            echo "::error::${GITHUB_REF_NAME} is a ${GITHUB_REF_TYPE}; this workflow releases a tag"
            exit 1
          fi
          case "${GITHUB_REF_NAME}" in
            v*) ;;
            *)
              echo "::error::tag ${GITHUB_REF_NAME} is not a v* release tag"
              exit 1
              ;;
          esac

      # Actions are pinned by commit SHA, not by tag: a tag is mutable and has been
      # moved in a real supply-chain compromise, and a moved tag in a job that holds
      # contents: write publishes whatever it now points at.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # The gate runs again here rather than being trusted from the pull request.
      # A tag can be pushed to any commit, including one that never passed CI, and a
      # release is the artifact people actually run.
      - name: Verify
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -count=2 -timeout 30m ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist

          # -trimpath removes the builder's absolute paths from the binary, and
          # SOURCE_DATE_EPOCH plus a fixed tar mtime makes the archives reproducible:
          # a second run on the same tag produces the same checksums, which is what
          # makes the published checksums file worth verifying against.
          export SOURCE_DATE_EPOCH=0

          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64
          do
            os="${target%/*}"
            arch="${target#*/}"
            name="signpost_${version}_${os}_${arch}"
            stage="dist/${name}"
            mkdir -p "$stage"

            bin="signpost"
            if [ "$os" = "windows" ]; then bin="signpost.exe"; fi

            GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o "${stage}/${bin}" \
              ./cmd/signpost

            cp LICENSE README.md "$stage/"

            if [ "$os" = "windows" ]; then
              (cd dist && zip -q -X -r "${name}.zip" "$name")
            else
              tar --sort=name --owner=0 --group=0 --numeric-owner \
                  --mtime="@${SOURCE_DATE_EPOCH}" \
                  -czf "dist/${name}.tar.gz" -C dist "$name"
            fi
            rm -rf "$stage"
          done

          # Archives only, by basename so an installer can run `sha256sum -c` from
          # whatever directory it downloaded into. Globbed by extension rather than
          # listed: a bare `ls` would sweep in checksums.txt itself on a re-run and
          # the file would attest to its own contents. LC_ALL=C so glob expansion
          # sorts by byte value and the file is byte-identical on any runner.
          (cd dist && LC_ALL=C sha256sum -- *.tar.gz *.zip > checksums.txt)
          cat dist/checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            dist/*
