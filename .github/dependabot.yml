# Dependency governance, per design §8. The posture is not "no dependencies" but
# "dependencies we can patch ourselves" — which is only true if a CVE arrives as a
# pull request rather than as something someone notices.
#
# Dependabot handles security alerts and the ecosystems Renovate is not configured
# for here; renovate.json groups routine non-security bumps onto a weekly cadence so
# they do not arrive as a stream of individual pull requests.
version: 2

updates:
  # Go modules: the OpenTelemetry API, trace API, and SDK (ADR 0014), plus their closure. Enabled
  # from the first commit, when there was nothing to bump, so the first dependency
  # added was covered on the day it landed rather than whenever somebody remembered to
  # configure this.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # A version has to have existed for a week before Dependabot proposes it. The
    # threat this addresses is not a bad release, it is a hostile one: an account
    # takeover publishes a malicious version, and the window between publication and
    # the ecosystem noticing is measured in hours. A tool whose whole posture is
    # "dependencies we can patch ourselves" should not be the fastest adopter of a
    # version nobody has looked at yet.
    #
    # Security advisories are exempt by design — Dependabot ignores cooldown for
    # them, which is the correct asymmetry: a known CVE is a reason to move faster,
    # not to wait.
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
      include: scope

  # GitHub Actions. These run with write access on a protected branch, which makes
  # them the highest-consequence dependency in the repository. They are pinned by
  # commit SHA, and Dependabot understands the `# vX.Y.Z` comment convention — it
  # bumps the SHA and updates the comment, so pinning does not mean going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Same week, and it matters more here than for Go modules. An action runs with
    # write access on this repository, so a hijacked tag is not a dependency problem
    # but a direct supply-chain position — the case the SHA pinning above already
    # assumes will happen, since it has.
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
      include: scope
